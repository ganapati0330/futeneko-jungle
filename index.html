  const k = KEYMAP[e.code];
  if (k) {
    e.preventDefault();
    if (k === 'jump' && !Key.jump) Key.jumpPressed = JUMP_BUF;
    if (k === 'up' && !Key.jump && !(G.player && G.player.climb) && onVineNow()) { /* つるでは のぼる */ }
    else if (k === 'up' && !Key.jump) { Key.jump = true; Key.jumpPressed = JUMP_BUF; }
    Key[k] = true; Snd.init();
  }
  if (e.code === 'Enter' || e.code === 'Escape') { Snd.init(); handleEnter(e.code); }
  if (e.code === 'KeyM') { Snd.setMuted(!Snd.muted); updSoundBtn(); }
}, { passive: false });
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { e.preventDefault(); Key[k] = false; if (k === 'up') Key.jump = false; } }, { passive: false });
addEventListener('blur', () => { Key.left = Key.right = Key.jump = Key.dash = Key.up = Key.down = false; });

const isTouch = matchMedia('(pointer:coarse)').matches;

/* ---------------- 画面の向き（スマホは横向きで遊ぶ） ---------------- */
let ROT = false;
const stageEl = document.getElementById('stage');
const orientHint = document.getElementById('orienthint');
let hintTimer = 0;

function applyOrient() {
  const portrait = innerHeight > innerWidth;
  const want = isTouch && portrait;
  if (want !== ROT) {
    ROT = want;
    if (ROT) {
      stageEl.classList.add('rot');
      orientHint.classList.add('on');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => orientHint.classList.remove('on'), 3200);
    } else {
      stageEl.classList.remove('rot');
      orientHint.classList.remove('on');
    }
  }
  if (ROT) { stageEl.style.width = innerHeight + 'px'; stageEl.style.height = innerWidth + 'px'; }
  else { stageEl.style.width = ''; stageEl.style.height = ''; }
  applyCompact();
  if (typeof resize === 'function') resize();
}

/* 見た目の 画面の たかさ（回転しているときは 幅と 入れかわる） */
function viewH() { return ROT ? innerWidth : innerHeight; }
function viewW() { return ROT ? innerHeight : innerWidth; }

/* せまい画面では メニューを 2だん組みに して ボタンが かならず 見えるように */
function applyCompact() {
  const el = document.getElementById('screens');
  if (!el) return;
  const h = viewH(), w = viewW();
  if (h <= 560) el.classList.add('compact'); else el.classList.remove('compact');
  if (h <= 560 && w >= h * 1.35) el.classList.add('wide'); else el.classList.remove('wide');
}

/* ---------------- 全画面と 向きロック ----------------
   スマホでは アドレスバーや ページの スライドが じゃまなので、
   さわった ときに 全画面へ。iOS Safari は 全画面 API が ないので、
   ページ自体を スクロールさせない しかけで 代用する。
------------------------------------------------------------ */
let fsTried = 0;
function fullscreenOn() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function goFullscreen() {
  if (!isTouch || fullscreenOn()) return;
  if (Date.now() - fsTried < 900) return;      /* 連打で 何度も 出さない */
  fsTried = Date.now();
  const el = document.documentElement;
  if (!el) return;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) {
    try {
      const r = req.call(el, { navigationUI: 'hide' });
      if (r && r.catch) r.catch(() => {});
    } catch (err) { /* 未対応・拒否は 無視 */ }
  }
  lockOrientation();
}
function lockOrientation() {
  try {
    if (typeof screen !== 'undefined' && screen.orientation && screen.orientation.lock) {
      const r = screen.orientation.lock('landscape');
      if (r && r.catch) r.catch(() => {});
    }
  } catch (err) { /* 未対応端末は CSS 回転で カバー */ }
}
function goLandscape() { goFullscreen(); lockOrientation(); }

/* ページが スライドしないように おさえこむ */
function lockPage() {
  const stop = e => {
    /* メニューの カードの 中だけは 指で スクロールさせる */
    let n = e.target;
    while (n) {
      if (n.id === 'card' || (n.classList && n.classList.contains('card'))) return;
      n = n.parentNode;
    }
    if (e.cancelable) e.preventDefault();
  };
  ['touchmove', 'gesturestart', 'gesturechange', 'gestureend'].forEach(t => {
    try { document.addEventListener(t, stop, { passive: false }); } catch (err) {}
  });
  /* iOS の アドレスバー かくし：つねに いちばん上へ */
  const top = () => { try { scrollTo(0, 0); } catch (err) {} };
  addEventListener('scroll', top, { passive: true });
  addEventListener('orientationchange', () => setTimeout(top, 250));
  /* ダブルタップ ズームを ふうじる */
  let lastTap = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTap < 320 && e.cancelable) e.preventDefault();
    lastTap = now;
  }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault());
}
if (isTouch) lockPage();


/* ---------------- 指だけで あそぶ そうさ ----------------
   画面左半分：バーチャルスティック（左右で 歩く／ダッシュ、上下で つるの のぼりおり）
   画面右半分：タップで ジャンプ（おしっぱなしで 高く）
   左スティックを 上に はじいても ジャンプ（片手あそび）
------------------------------------------------------------ */
const dragzone = document.getElementById('dragzone');
const stickEl = document.getElementById('stick');
const knobEl = document.getElementById('knob');
const tapfx = document.getElementById('tapfx');

const DEAD = 8;        /* ここまでは 止まったまま */
const FULL = 34;       /* ここで 歩く 最大 */
const DASH_D = 52;     /* ここを こえたら ダッシュ */
const CLIMB_DEAD = 10; /* つるの のぼりおり */
const FLICK_UP = 30;   /* 上へ はじいて ジャンプ */
const FOLLOW = 74;     /* スティックの 支点が 指を おいかける きょり */

const touches = new Map();   // pointerId -> {role, ox, oy, jumped, moved}

function stickShow(x, y) {
  stickEl.style.left = x + 'px'; stickEl.style.top = y + 'px';
  stickEl.classList.add('on');
  knobEl.style.transform = 'translate(0px,0px)';
}
function ringAt(x, y) {
  tapfx.style.left = x + 'px'; tapfx.style.top = y + 'px';
  tapfx.classList.remove('go'); void tapfx.offsetWidth; tapfx.classList.add('go');
}
function clearMoveKeys() { Key.left = Key.right = Key.dash = Key.up = Key.down = false; }
function anyJumpHeld() { for (const t of touches.values()) if (t.jumped) return true; return false; }
function doJump() { if (!Key.jump) Key.jumpPressed = JUMP_BUF; Key.jump = true; }

/* 画面上の座標 → ステージ内の座標（回転していても 正しく変換） */
function toLocal(e) {
  return ROT ? { x: e.clientY, y: innerWidth - e.clientX }
             : { x: e.clientX, y: e.clientY };
}
function zoneW() { return dragzone.offsetWidth || (ROT ? innerHeight : innerWidth); }

dragzone.addEventListener('pointerdown', e => {
  e.preventDefault(); Snd.init(); goFullscreen();
  const L = toLocal(e);
  if (L.x < zoneW() * 0.5) {
    touches.set(e.pointerId, { role: 'move', ox: L.x, oy: L.y, jumped: false, moved: 0 });
    stickShow(L.x, L.y);
  } else {
    touches.set(e.pointerId, { role: 'jump', ox: L.x, oy: L.y, jumped: true, moved: 0 });
    doJump(); ringAt(L.x, L.y);
  }
  try { dragzone.setPointerCapture(e.pointerId); } catch (err) {}
}, { passive: false });

dragzone.addEventListener('pointermove', e => {
  const t = touches.get(e.pointerId);
  if (!t) return;
  e.preventDefault();
  const L = toLocal(e);
  if (t.role !== 'move') return;

  let dx = L.x - t.ox, dy = L.y - t.oy;
  t.moved = Math.max(t.moved, Math.abs(dx) + Math.abs(dy));
  /* 支点を 指に おいかけさせる（すべっても ズレない） */
  if (dx > FOLLOW) { t.ox = L.x - FOLLOW; dx = FOLLOW; }
  if (dx < -FOLLOW) { t.ox = L.x + FOLLOW; dx = -FOLLOW; }
  if (dy > FOLLOW) { t.oy = L.y - FOLLOW; dy = FOLLOW; }
  if (dy < -FOLLOW) { t.oy = L.y + FOLLOW; dy = -FOLLOW; }

  /* つるの 上（または つるに ふれている）なら 上下は のぼりおりに つかう */
  const onLadder = !!(G.player && (G.player.climb || onVine(G.player) >= 0));
  const climbing = onLadder;
  const ax = Math.abs(dx), ay = Math.abs(dy);

  /* 左右：ななめでも ちゃんと 歩けるように、たてに 大きく ふっているときだけ 止める */
  const wantSide = ax > DEAD && (!climbing || ax > ay * 0.7);
  Key.left = wantSide && dx < 0;
  Key.right = wantSide && dx > 0;
  Key.dash = ax > DASH_D;

  /* 上下：つるの のぼりおり。つるに いないときは 使わない */
  Key.up = climbing && dy < -CLIMB_DEAD;
  Key.down = climbing && dy > CLIMB_DEAD;

  stickEl.classList.toggle('dash', Key.dash);
  stickEl.style.left = t.ox + 'px'; stickEl.style.top = t.oy + 'px';
  const kx = clamp(dx, -46, 46), ky = clamp(climbing ? dy : dy * 0.5, -34, 34);
  knobEl.style.transform = 'translate(' + kx + 'px,' + ky + 'px)';

  /* 上へ はじいて ジャンプ（つるの ときは のぼる ほうを ゆうせん） */
  if (!climbing && dy < -FLICK_UP && !t.jumped) {
    t.jumped = true; doJump(); ringAt(L.x, L.y);
  } else if (dy > -FLICK_UP * 0.55 && t.jumped) {
    t.jumped = false; if (!anyJumpHeld()) Key.jump = false;
  }
}, { passive: false });

function endTouch(e) {
  const t = touches.get(e.pointerId);
  if (!t) return;
  touches.delete(e.pointerId);
  if (t.role === 'move') {
    let another = false;
    for (const v of touches.values()) if (v.role === 'move') another = true;
    if (!another) { clearMoveKeys(); stickEl.classList.remove('on', 'dash'); }
  }
  if (!anyJumpHeld()) Key.jump = false;
}
dragzone.addEventListener('pointerup', endTouch);
dragzone.addEventListener('pointercancel', endTouch);
dragzone.addEventListener('lostpointercapture', endTouch);
dragzone.addEventListener('contextmenu', e => e.preventDefault());

function releaseAllTouch() {
  touches.clear(); clearMoveKeys(); Key.jump = false;
  stickEl.classList.remove('on', 'dash');
}

/* ---------------- キャンバス ---------------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0;
function resize() {
  const st = document.getElementById('stage');
  const rw = st.offsetWidth || innerWidth, rh = st.offsetHeight || innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.floor(rw * dpr); cv.height = Math.floor(rh * dpr);
  scale = Math.min(cv.width / VW, cv.height / VH);
  offX = (cv.width - VW * scale) / 2; offY = (cv.height - VH * scale) / 2;
}
addEventListener('resize', applyOrient);
addEventListener('orientationchange', () => setTimeout(applyOrient, 120));
if (typeof screen !== 'undefined' && screen.orientation && screen.orientation.addEventListener)
  screen.orientation.addEventListener('change', () => setTimeout(applyOrient, 120));

/* =======================================================================
   ステージ
   ======================================================================= */
const G = {
  state: 'title', lv: 0, rows: [], W: 0, H: 0, theme: 'grass',
  lives: START_LIVES, coins: 0, score: 0, time: 0,
  cam: { x: 0, y: 0 }, spawn: { x: 0, y: 0 }, check: null,
  ents: [], parts: [], items: [], player: null,
  boss: null, bossDead: false, goal: null, shake: 0, frames: 0,
  clearTimer: 0, deadTimer: 0, tint: null
};

function tileAt(x, y) {
  if (y < 0) return ' ';
  if (x < 0 || x >= G.W) return '#';
  if (y >= G.H) return ' ';
  return G.rows[y][x];
}
function setTile(x, y, ch) {
  if (x < 0 || x >= G.W || y < 0 || y >= G.H) return;
  const r = G.rows[y];
  G.rows[y] = r.substring(0, x) + ch + r.substring(x + 1);
}
const isSolid = ch => SOLID.indexOf(ch) >= 0;
const isHazard = ch => HAZARD.indexOf(ch) >= 0;

/* ---------------- エンティティ ---------------- */
function mkEnemy(type, tx, ty) {
  const base = { type, vx: 0, vy: 0, dir: -1, hp: 1, dead: false, t: Math.random() * 100, grav: true, ground: false, state: 'walk', flash: 0 };
  const cfg = {
    t: { w: 26, h: 24, sp: 0.75, hp: 1, ledge: true },
    d: { w: 28, h: 26, sp: 1.35, hp: 1, ledge: true },
    b: { w: 40, h: 38, sp: 0.9, hp: 2, ledge: true },
    r: { w: 30, h: 24, sp: 1.25, hp: 1, grav: false },
    k: { w: 24, h: 30, sp: 1.55, hp: 1, ledge: false },
    K: { w: 76, h: 92, sp: 1.9, hp: 3, ledge: false }
  }[type];
  Object.assign(base, cfg);
  base.x = tx * T + (T - base.w) / 2;
  base.y = ty * T + T - base.h;
  base.homeY = base.y;
  base.vx = -cfg.sp;
  return base;
}

function loadLevel(i) {
  const L = LEVELS[i];
  G.lv = i; G.rows = L.rows.slice(); G.W = L.rows[0].length; G.H = L.rows.length;
  G.theme = L.theme; G.ents = []; G.parts = []; G.items = [];
  G.boss = null; G.bossDead = false; G.bossMet = false; G.goal = null; G.check = null;
  G.keys = 0; G.needKeys = L.keys || 0; G.doorMsg = 0;
  G.seen = new Uint8Array(G.W * G.H);
  G.time = 0; G.frames = 0; G.shake = 0; G.clearTimer = 0; G.deadTimer = 0;
  G.movers = [];
  /* 肉球ブロックの中身をステージごとに配分（各ステージに必ずスターとハートが出る） */
  G.qMap = {};
  let qi = 0;
  for (let y = 0; y < G.H; y++) for (let x = 0; x < G.W; x++) {
    if (G.rows[y][x] === '?') {
      const m = qi % 5;
      G.qMap[x + ',' + y] = m === 0 ? 'star' : (m === 1 ? 'life' : 'coin');
      qi++;
    }
  }
  for (let y = 0; y < G.H; y++) {
    for (let x = 0; x < G.W; x++) {
      const c = G.rows[y][x];
      if (c === 'P') { G.spawn = { x: x * T + 4, y: y * T - 2 }; setTile(x, y, ' '); }
      else if ('tdbrk'.indexOf(c) >= 0) { G.ents.push(mkEnemy(c, x, y)); setTile(x, y, ' '); }
      else if (c === 'K') {
        G.boss = mkEnemy('K', x, y);
        G.boss.phase = 0; G.boss.inv = 0;
        G.boss.hp = BOSS_HP[i] || 3; G.boss.maxHp = G.boss.hp;
        G.boss.awake = false;
        /* 足もとの 地続きの床＝ボス広場。ここから 外に 出さない（穴に落ちない） */
        let fy = y + 1;
        while (fy < G.H - 1 && !isSolid(tileAt(x, fy))) fy++;
        let a0 = x, a1 = x;
        while (a0 > 1 && isSolid(tileAt(a0 - 1, fy))) a0--;
        while (a1 < G.W - 2 && isSolid(tileAt(a1 + 1, fy))) a1++;
        G.boss.arena = { x0: a0 * T, x1: (a1 + 1) * T, fy };
        G.boss.throws = i >= 2;                 /* 3ステージ目から ボールを投げてくる */
        G.boss.sp = 1.35 + i * 0.16;
        G.ents.push(G.boss); setTile(x, y, ' ');
      }
      else if (c === 'M' || c === 'V') {
        G.movers.push({ x: x * T, y: y * T + 6, w: T * 3, h: 12, ox: x * T, oy: y * T + 6,
          vert: c === 'V', t: Math.random() * 6.28, range: c === 'V' ? T * 3.2 : T * 3.6, px: 0, py: 0 });
        setTile(x, y, ' ');
      }
      else if (c === 'G') { G.goal = { x: x * T + T / 2, y: y * T + T, tx: x, ty: y }; setTile(x, y, ' '); }
      else if (c === 'C') { G.check = { x: x * T + T / 2, y: y * T + T, got: false }; setTile(x, y, ' '); }
      else if (c === 'y') {
        G.items.push({ x: x * T + 5, y: y * T + 4, w: 22, h: 22, vx: 0, vy: 0, kind: 'key', t: 0, hx: x * T + 5, hy: y * T + 4 });
        setTile(x, y, ' ');
      }
    }
  }
  G.player = {
    x: G.spawn.x, y: G.spawn.y, w: 20, h: 30, vx: 0, vy: 0, dir: 1,
    ground: false, coyote: 0, inv: 0, star: 0, big: 0, growT: 0, anim: 0, jumping: false, dead: false, climb: false
  };
  G.cam.x = clamp(G.player.x - VW / 2, 0, Math.max(0, G.W * T - VW));
  G.cam.y = clamp(G.player.y - VH / 2, 0, Math.max(0, G.H * T - VH));
  Snd.playMusic(G.theme);
  toast(L.name + ' / ' + L.hint, 2600);
}

/* プレイヤーが ふれている とびらを あける */
function touchTiles(p) {
  const x0 = Math.floor((p.x - 2) / T), x1 = Math.floor((p.x + p.w + 2) / T);
  const y0 = Math.floor((p.y - 2) / T), y1 = Math.floor((p.y + p.h + 2) / T);
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      if (tileAt(x, y) !== 'D') continue;
      if (G.keys >= G.needKeys) openDoor(x, y);
      else if (G.doorMsg <= 0) {
        G.doorMsg = 90;
        toast('カギが たりない！（' + G.keys + '／' + G.needKeys + '）', 1800);
        Snd.sfx('bump');
      }
      return;
    }
  }
}

function openDoor(sx, sy) {
  let cnt = 0;
  for (let y = 0; y < G.H; y++) {          /* カギが そろったら すべての とびらが ひらく */
    for (let x = 0; x < G.W; x++) {
      if (tileAt(x, y) !== 'D') continue;
      cnt++;
      setTile(x, y, ' ');
      const near = Math.abs(x - sx) + Math.abs(y - sy) < 8;
      for (let i = 0; i < (near ? 8 : 3); i++)
        part(x * T + 16, y * T + 16, rnd(-3, 3), rnd(-5, -1), '#c9a227', rnd(26, 48), 5);
    }
  }
  if (cnt) {
    G.shake = 8; G.score += 500;
    Snd.sfx('power');
    toast('とびらが ひらいた！ おくへ すすもう！', 2400);
  }
}

/* やられた場所から いちばん近い 安全な足場をさがす */
function safeSpot(px, py) {
  const cx = (px + 10) / T, cy = (py + 15) / T;
  const vert = G.H * T > VH * 1.4;
  let best = null, bestD = Infinity;
  for (let y = 1; y < G.H - 1; y++) {
    for (let x = 1; x < G.W - 1; x++) {
      if (!isSolid(tileAt(x, y + 1))) continue;                  /* 足もとに 地面がある */
      const a = tileAt(x, y), b = tileAt(x, y - 1);
      if (isSolid(a) || isSolid(b)) continue;                    /* 体が すっぽり入る */
      if (isHazard(a) || isHazard(b) || isHazard(tileAt(x, y + 1))) continue;
      if (isHazard(tileAt(x - 1, y)) || isHazard(tileAt(x + 1, y))) continue;
      if (isHazard(tileAt(x, y + 2))) continue;
      let d = (x - cx) * (x - cx) + (y - cy) * (y - cy) * 1.9;
      if (!vert && x > cx) d *= 2.4;                             /* できれば 手前がわに もどす */
      for (const e of G.ents) {                                  /* 敵のそばは さける */
        if (e.dead) continue;
        const ed = Math.abs(e.x / T - x) + Math.abs(e.y / T - y);
        if (ed < 4.5) d += (4.5 - ed) * 320;
      }
      if (d < bestD) { bestD = d; best = { x: x * T + 6, y: (y + 1) * T - 30 }; }
    }
  }
  return best;
}

function respawn() {
  const p = G.player;
  const near = safeSpot(p.x, p.y);
  const s = near || ((G.check && G.check.got) ? { x: G.check.x - 10, y: G.check.y - 34 } : G.spawn);
  p.x = s.x; p.y = s.y; p.vx = 0; p.vy = 0; p.dead = false; p.inv = 90; p.star = 0; p.big = 0; p.growT = 0; p.climb = false;
  G.cam.x = clamp(p.x - VW / 2, 0, Math.max(0, G.W * T - VW));
  G.cam.y = clamp(p.y - VH / 2, 0, Math.max(0, G.H * T - VH));
  G.items = G.items.filter(it => it.kind !== 'ball');
  popText(p.x + 10, p.y - 6, 'ここから さいスタート！', '#5aa845');
}

/* ---------------- パーティクル ---------------- */
function part(x, y, vx, vy, col, life, size, grav) {
  G.parts.push({ x, y, vx, vy, col, life, max: life, size: size || 4, g: grav == null ? 0.35 : grav });
}
function burst(x, y, col, n) {
  for (let i = 0; i < (n || 8); i++)
    part(x, y, rnd(-3, 3), rnd(-4.5, -1), col, rnd(22, 40), rnd(3, 6));
}
function popText(x, y, txt, col) {
  G.parts.push({ x, y, vx: 0, vy: -1.1, txt, col: col || '#fff', life: 48, max: 48, g: 0 });
}

/* ---------------- 当たり判定 ---------------- */
function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function moveBody(o, movers) {
  /* X */
  o.x += o.vx;
  let t0 = Math.floor(o.y / T), t1 = Math.floor((o.y + o.h - 1) / T);
  if (o.vx > 0) {
    const c = Math.floor((o.x + o.w) / T);
    for (let y = t0; y <= t1; y++) if (isSolid(tileAt(c, y))) { o.x = c * T - o.w - 0.01; o.vx = 0; o.hitWall = 1; break; }
  } else if (o.vx < 0) {
    const c = Math.floor(o.x / T);
    for (let y = t0; y <= t1; y++) if (isSolid(tileAt(c, y))) { o.x = (c + 1) * T + 0.01; o.vx = 0; o.hitWall = -1; break; }
  }
  /* Y */
  const prevBottom = o.y + o.h;
  o.y += o.vy;
  o.ground = false;
  let l = Math.floor(o.x / T), r = Math.floor((o.x + o.w - 1) / T);
  if (o.vy > 0) {
    const c = Math.floor((o.y + o.h) / T);
    for (let x = l; x <= r; x++) {
      const ch = tileAt(x, c);
      if (isSolid(ch) || (ch === '=' && prevBottom <= c * T + 6)) {
        o.y = c * T - o.h; o.vy = 0; o.ground = true; break;
      }
    }
  } else if (o.vy < 0) {
    const c = Math.floor(o.y / T);
    for (let x = l; x <= r; x++) {
      if (isSolid(tileAt(x, c))) { o.y = (c + 1) * T + 0.01; o.vy = 0; o.headHit = { x, y: c }; break; }
    }
  }
  /* 移動床 */
  if (movers && o.vy >= 0) {
    for (const m of movers) {
      if (o.x + o.w > m.x && o.x < m.x + m.w &&
          prevBottom <= m.y + 8 && o.y + o.h >= m.y && o.y + o.h <= m.y + 20) {
        o.y = m.y - o.h; o.vy = 0; o.ground = true; o.rideX = m.px; o.rideY = m.py;
      }
    }
  }
}

/* ---------------- プレイヤー ---------------- */
function onVineNow() { return G.player ? onVine(G.player) >= 0 : false; }

function onVine(p) {
  const cx = Math.floor((p.x + p.w / 2) / T);
  const y0 = Math.floor((p.y + 4) / T), y1 = Math.floor((p.y + p.h - 4) / T);
  for (let y = y0; y <= y1; y++) if (tileAt(cx, y) === 'L') return cx;
  return -1;
}

function updatePlayer() {
  const p = G.player;
  if (p.dead) return;

  /* ---- つるに つかまる ---- */
  const vc = onVine(p);
  if (vc < 0) p.climb = false;
  else if (!p.climb && (Key.up || Key.down || (!p.ground && p.vy > 0 && (Key.left || Key.right)))) {
    p.climb = true; p.vy = 0; p.jumping = false;
    p.x = vc * T + (T - p.w) / 2;
    Snd.sfx('check');
  }
  if (p.climb) {
    p.vy = Key.up ? -CLIMB_SP : Key.down ? CLIMB_SP : 0;
    p.vx = (Key.left ? -1 : Key.right ? 1 : 0) * 1.7;
    if (Key.left) p.dir = -1; else if (Key.right) p.dir = 1;
    if (Key.jumpPressed > 0) {                       /* つるから ジャンプ */
      p.climb = false; p.vy = -JUMP_V * 0.86; p.jumping = true;
      Key.jumpPressed = 0; Snd.sfx('jump');
    }
    if (p.climb) {
      p.anim += 0.18;
      p.headHit = null; p.rideX = 0; p.rideY = 0; p.hitWall = 0;
      moveBody(p, G.movers);
      p.x = clamp(p.x, 0, G.W * T - p.w);
      p.coyote = COYOTE;
      if (Key.jumpPressed > 0) Key.jumpPressed--;
      touchTiles(p);
      return;
    }
  }
  let maxSp = Key.dash ? MAX_DASH : MAX_RUN;
  if (p.big) maxSp *= 1.12;
  const acc = p.ground ? RUN_ACC : AIR_ACC;
  if (Key.left && !Key.right) { p.vx -= acc; p.dir = -1; }
  else if (Key.right && !Key.left) { p.vx += acc; p.dir = 1; }
  else p.vx *= p.ground ? FRIC_GROUND : FRIC_AIR;
  p.vx = clamp(p.vx, -maxSp, maxSp);
  if (Math.abs(p.vx) < 0.05) p.vx = 0;

  if (p.ground) p.coyote = COYOTE; else if (p.coyote > 0) p.coyote--;
  if (Key.jumpPressed > 0) Key.jumpPressed--;
  if (Key.jumpPressed > 0 && p.coyote > 0) {
    p.vy = -(p.big ? JUMP_V * 1.07 : JUMP_V); p.ground = false; p.coyote = 0; Key.jumpPressed = 0; p.jumping = true;
    Snd.sfx('jump'); part(p.x + p.w / 2, p.y + p.h, rnd(-1, 1), rnd(-1, 0), '#fff', 20, 5, .1);
  }
  if (!Key.jump && p.vy < 0 && p.jumping) { p.vy *= JUMP_CUT; p.jumping = false; }
  if (p.vy > 0) p.jumping = false;

  p.vy = Math.min(p.vy + GRAV, MAXFALL);
  p.headHit = null; p.rideX = 0; p.rideY = 0; p.hitWall = 0;
  moveBody(p, G.movers);
  p.x += p.rideX; p.y += p.rideY;
  p.x = clamp(p.x, 0, G.W * T - p.w);

  /* でっかいモード：よこのレンガを たいあたりで こわす */
  if (p.big && p.hitWall) {
    const cx = p.hitWall > 0 ? Math.floor((p.x + p.w + 2) / T) : Math.floor((p.x - 2) / T);
    const ry0 = Math.floor((p.y + 3) / T), ry1 = Math.floor((p.y + p.h - 3) / T);
    for (let ry = ry0; ry <= ry1; ry++) {
      if (tileAt(cx, ry) === 'B') {
        setTile(cx, ry, ' '); Snd.sfx('block'); G.score += 20; G.shake = 5;
        for (let i = 0; i < 8; i++) part(cx * T + 16, ry * T + 16, rnd(-3.2, 3.2), rnd(-5, -1.5), '#a4643a', rnd(24, 44), 5);
      }
    }
  }

  touchTiles(p);
  if (G.doorMsg > 0) G.doorMsg--;

  /* 頭でブロックを叩く */
  if (p.headHit) {
    const { x, y } = p.headHit, ch = tileAt(x, y);
    if (ch === '?') {
      setTile(x, y, 'U');
      const roll = G.qMap[x + ',' + y] || 'coin';
      if (roll === 'star') {
        G.items.push({ x: x * T + 4, y: y * T - 26, w: 24, h: 24, vx: 1.6, vy: -3, kind: 'star', t: 0 });
        Snd.sfx('power');
      } else if (roll === 'life') {
        G.items.push({ x: x * T + 5, y: y * T - 26, w: 22, h: 22, vx: 0.9, vy: -4.6, kind: 'life', t: 0 });
        Snd.sfx('power');
        popText(x * T + 16, y * T - 12, '1UP ハート！', '#f5629b');
      } else {
        addCoin(1); G.score += 30;
        popText(x * T + 16, y * T - 8, '+1', '#f2c14e');
        burst(x * T + 16, y * T, '#f2c14e', 6);
      }
      G.shake = 4;
    } else if (ch === 'B') {
      setTile(x, y, ' '); Snd.sfx('block'); G.score += 20; G.shake = 5;
      for (let i = 0; i < 8; i++) part(x * T + 16, y * T + 16, rnd(-3.2, 3.2), rnd(-5, -1.5), '#a4643a', rnd(24, 44), 5);
    } else if (isSolid(ch)) Snd.sfx('bump');
  }

  /* タイル効果 */
  const cx = Math.floor((p.x + p.w / 2) / T);
  for (let y = Math.floor(p.y / T); y <= Math.floor((p.y + p.h - 1) / T); y++) {
    for (let x = Math.floor(p.x / T); x <= Math.floor((p.x + p.w - 1) / T); x++) {
      const ch = tileAt(x, y);
      if (ch === 'o') { setTile(x, y, ' '); addCoin(1); burst(x * T + 16, y * T + 16, '#f2c14e', 5); }
      else if (ch === 'S' && p.vy >= 0 && p.y + p.h >= y * T + 6) {
        p.y = y * T - p.h; p.vy = -JUMP_V * 1.42; p.jumping = false; Snd.sfx('spring');
        G.springAnim = { x, y, t: 12 };
      }
      else if (isHazard(ch) && p.inv <= 0 && p.star <= 0) hurt();
    }
  }
  if (p.y > (G.H + 2) * T) { hurt(false, true); }

  if (p.inv > 0) p.inv--;
  if (p.growT > 0) p.growT--;
  if (p.star > 0) {
    p.star--;
    if (p.star === 0) { p.big = 0; p.growT = 16; Snd.sfx('bump'); popText(p.x + 10, p.y, 'もとの おおきさ', '#fdf6e6'); }
  }
  p.anim += Math.abs(p.vx) * 0.09;

  /* 中間ポイント */
  if (G.check && !G.check.got &&
      Math.abs(p.x + p.w / 2 - G.check.x) < 26 && Math.abs(p.y + p.h - G.check.y) < 60) {
    G.check.got = true; Snd.sfx('check'); popText(G.check.x, G.check.y - 50, 'ちゅうかんポイント！', '#5aa845');
    toast('ここから やりなおせるよ', 1600);
  }
  /* ゴール */
  if (G.goal && G.state === 'play' && (!G.boss || G.bossDead)) {
    if (Math.abs(p.x + p.w / 2 - G.goal.x) < 34 && Math.abs(p.y + p.h - G.goal.y) < 60) stageClear();
  }
}

function addCoin(n) {
  const before = G.coins;
  G.coins += n; G.score += 20 * n; Snd.sfx('coin');
  if (Math.floor(G.coins / 100) > Math.floor(before / 100)) {
    gainLife('コイン100まい');
  }
}

function gainLife(why) {
  if (G.lives >= MAX_LIVES) { G.score += 1000; toast((why ? why + '！ ' : '') + 'ライフ まんタン ＋1000てん', 1600); Snd.sfx('power'); return; }
  G.lives++; G.score += 300; Snd.sfx('power');
  toast((why ? why + '！ ' : '') + 'ライフが 1つ ふえた！ (' + G.lives + '/' + MAX_LIVES + ')', 1700);
}

function hurt(_unused, force) {
  const p = G.player;
  if (p.dead) return;
  if (!force && (p.inv > 0 || p.star > 0)) return;
  p.dead = true; G.lives--; Snd.sfx('hurt'); Snd.stopMusic(); G.shake = 10;
  p.vy = force ? 0 : -9; p.vx = 0;
  G.deadTimer = 70;
  burst(p.x + p.w / 2, p.y + p.h / 2, '#e8842b', 12);
}

/* ---------------- 敵 ---------------- */
function updateEnemy(e) {
  if (e.dead) return;
  e.t++;
  const p = G.player;
  const vis = e.x + e.w > G.cam.x - 220 && e.x < G.cam.x + VW + 220 &&
              e.y + e.h > G.cam.y - 260 && e.y < G.cam.y + VH + 260;
  if (!vis && e.type !== 'K') return;
  unstick(e);          /* どの種類の てきでも かべに はまったら 助け出す */

  if (e.type === 'r') {
    e.x += e.vx;
    e.y = e.homeY + Math.sin(e.t * 0.035) * 46;
    const c = Math.floor((e.vx > 0 ? e.x + e.w : e.x) / T);
    if (isSolid(tileAt(c, Math.floor((e.y + e.h / 2) / T))) || e.x < T || e.x > (G.W - 1) * T - e.w) e.vx *= -1;
    e.dir = e.vx > 0 ? 1 : -1;
    return;
  }
  if (e.type === 'K') { updateBoss(e); return; }

  if (e.state === 'shell') {
    e.vy = Math.min(e.vy + GRAV, MAXFALL);
    e.hitWall = 0; moveBody(e, G.movers);
    if (e.hitWall) e.vx *= -1;
    if (Math.abs(e.vx) > 0.3) {
      for (const o of G.ents) {
        if (o === e || o.dead || o.state === 'shell') continue;
        if (rectHit(e, o)) { killEnemy(o, true); G.score += 200; popText(o.x + o.w / 2, o.y, '+200', '#fff'); }
      }
    } else { e.shellTimer = (e.shellTimer || 0) + 1; if (e.shellTimer > 480) { e.state = 'walk'; e.shellTimer = 0; e.vx = -e.sp; } }
    return;
  }

  if (e.type === 'k') {
    const dx = (p.x + p.w / 2) - (e.x + e.w / 2);
    if (Math.abs(dx) < 260) e.vx = Math.sign(dx) * e.sp;
    if (e.ground && p.y + p.h < e.y - 20 && Math.abs(dx) < 130 && e.t % 40 === 0) e.vy = -10.5;
  } else if (e.type === 'd') {
    if (e.ground && e.t % 96 === 0) e.vy = -7.5;
    e.vx = e.dir * e.sp;
  } else {
    e.vx = e.dir * e.sp;
  }

  e.vy = Math.min(e.vy + GRAV, MAXFALL);
  e.hitWall = 0;
  moveBody(e, G.movers);
  if (e.hitWall) e.dir *= -1;
  /* 崖で折り返す */
  if (e.ledge && e.ground) {
    const fx = Math.floor((e.dir > 0 ? e.x + e.w + 3 : e.x - 3) / T);
    const fy = Math.floor((e.y + e.h + 4) / T);
    const below = tileAt(fx, fy);
    if (!isSolid(below) && below !== '=' && below !== 'S') e.dir *= -1;
  }
  if (e.type !== 'k') e.vx = e.dir * e.sp; else e.dir = e.vx > 0 ? 1 : -1;
  if (e.x < T * 0.5) { e.x = T * 0.5; e.dir = 1; }
  if (e.x > G.W * T - T * 0.5 - e.w) { e.x = G.W * T - T * 0.5 - e.w; e.dir = -1; }
  if (e.y > (G.H + 2) * T) e.dead = true;
  if (e.flash > 0) e.flash--;
}

function killEnemy(e, launch) {
  e.dead = true; e.deadT = 0;
  burst(e.x + e.w / 2, e.y + e.h / 2, e.type === 'r' ? '#8fd0f5' : '#5b4636', 9);
}

/* ボスを 広場の中に とどめる（穴に落ちて 倒せなくなるのを防ぐ） */
/* 動けなくなった 敵を 助け出す（かべに はまって 倒せなくなるのを 防ぐ） */
function unstick(e, homeX, homeY) {
  if (e.dead) return;
  if (e.sx === undefined) { e.sx = e.x; e.sy = e.y; e.stuckT = 0; }
  const moved = Math.abs(e.x - e.sx) + Math.abs(e.y - e.sy);
  if (moved > 1.2) { e.sx = e.x; e.sy = e.y; e.stuckT = 0; return; }
  e.stuckT++;
  if (e.stuckT === 40) {                       /* まず 向きを かえて 押し出す */
    e.dir = -(e.dir || 1);
    e.vx = (e.dir || 1) * 2.2;
    e.vy = -6;
  }
  if (e.stuckT > 110) {                        /* それでも ダメなら 近くの あきマスへ */
    const spot = freeSpotNear(e);
    if (spot) { e.x = spot.x; e.y = spot.y; }
    else if (homeX !== undefined) { e.x = homeX; e.y = homeY; }
    e.vx = 0; e.vy = 0; e.stuckT = 0; e.sx = e.x; e.sy = e.y;
    for (let i = 0; i < 8; i++)
      part(e.x + e.w / 2, e.y + e.h / 2, rnd(-2.4, 2.4), rnd(-3.6, -0.6), '#fdf6e6', rnd(18, 32), 4);
  }
}

/* 体が すっぽり入って 足もとに 地面がある いちばん近い マスを さがす */
function freeSpotNear(e) {
  const cw = Math.ceil(e.w / T), chh = Math.ceil(e.h / T);
  const cx = Math.floor((e.x + e.w / 2) / T), cy = Math.floor((e.y + e.h) / T);
  let best = null, bd = Infinity;
  for (let y = Math.max(1, cy - 7); y < Math.min(G.H - 1, cy + 8); y++) {
    for (let x = Math.max(1, cx - 9); x < Math.min(G.W - 1, cx + 10); x++) {
      let clear = true;
      for (let dy = 0; dy < chh && clear; dy++)
        for (let dx = 0; dx < cw && clear; dx++) {
          const t = tileAt(x + dx, y - 1 - dy);
          if (isSolid(t) || isHazard(t)) clear = false;
        }
      if (!clear) continue;
      let floorOK = false;
      for (let dx = 0; dx < cw; dx++) if (isSolid(tileAt(x + dx, y))) floorOK = true;
      if (!floorOK || isHazard(tileAt(x, y))) continue;
      const d = (x - cx) * (x - cx) + (y - cy) * (y - cy);
      if (d < bd) { bd = d; best = { x: x * T + (cw * T - e.w) / 2, y: y * T - e.h }; }
    }
  }
  return best;
}

function keepInArena(b) {
  const a = b.arena;
  if (!a) return;
  if (b.x < a.x0 + 3) { b.x = a.x0 + 3; if (b.vx < 0) b.vx = Math.abs(b.vx); }
  if (b.x + b.w > a.x1 - 3) { b.x = a.x1 - 3 - b.w; if (b.vx > 0) b.vx = -Math.abs(b.vx); }
  if (b.y + b.h > (a.fy + 3) * T) {                 /* 万一 落ちても 広場の まんなかに もどす */
    b.x = (a.x0 + a.x1) / 2 - b.w / 2;
    b.y = a.fy * T - b.h;
    b.vx = 0; b.vy = 0;
  }
}

function updateBoss(b) {
  const p = G.player;
  /* プレイヤーが 近づくまでは じっと待つ（ステージ開始時に 音や画面ゆれが 出ないように） */
  if (!b.awake) {
    b.vx = 0;
    b.vy = Math.min(b.vy + GRAV, MAXFALL);
    moveBody(b, null);
    keepInArena(b);
    if (b.ground) b.vy = 0;
    const near = Math.abs((p.x + p.w / 2) - (b.x + b.w / 2)) < VW * 0.62 &&
                 Math.abs((p.y + p.h) - (b.y + b.h)) < VH * 0.8;
    if (near && !p.dead && G.state === 'play') {
      b.awake = true; b.cool = 46;
      G.bossMet = true; G.shake = 10; Snd.sfx('boss');
      popText(b.x + b.w / 2, b.y - 6, 'ボス とうじょう！', '#e5484d');
      toast('ボスだ！ たおさないと 先へ すすめない！', 2600);
    }
    b.dir = (p.x + p.w / 2) > (b.x + b.w / 2) ? 1 : -1;
    return;
  }
  if (b.inv > 0) b.inv--;
  b.vy = Math.min(b.vy + GRAV, MAXFALL);
  b.hitWall = 0;
  const dx = (p.x + p.w / 2) - (b.x + b.w / 2);
  const spd = b.sp + (b.maxHp - b.hp) * 0.7;
  if (b.ground) {
    b.cool = (b.cool || 0) - 1;
    b.vx = Math.sign(dx || 1) * spd * 0.6;
    if (b.cool <= 0) {
      b.cool = Math.max(48, 96 - (b.maxHp - b.hp) * 18);
      if (!b.throws || Math.random() < 0.6) {
        b.vy = -13.5;
        /* 広場からはみ出す方向へは 飛ばない */
        const room = b.arena ? (dx > 0 ? b.arena.x1 - (b.x + b.w) : (b.x - b.arena.x0)) : 999;
        b.vx = Math.sign(dx || 1) * spd * (room < 90 ? 0.25 : 1);
      }
      else {
        /* ボール投げ */
        G.items.push({ x: b.x + b.w / 2, y: b.y + 18, w: 16, h: 16, vx: Math.sign(dx || 1) * 4.2, vy: -3.4, kind: 'ball', t: 0 });
        Snd.sfx('bump');
      }
    }
  } else b.vx *= 0.995;
  const wasAir = !b.ground;
  moveBody(b, null);
  keepInArena(b);
  unstick(b, b.arena ? (b.arena.x0 + b.arena.x1) / 2 - b.w / 2 : undefined,
          b.arena ? b.arena.fy * T - b.h : undefined);
  if (b.hitWall) b.vx *= -1;
  if (b.ground && wasAir) {
    G.shake = 9; Snd.sfx('boss');
    for (let i = 0; i < 10; i++) part(b.x + b.w / 2, b.y + b.h, rnd(-4, 4), rnd(-5, -1), '#c8bda8', 30, 6);
  }
  b.dir = dx > 0 ? 1 : -1;
}

/* ---------------- アイテム ---------------- */
function updateItems() {
  const p = G.player;
  for (const it of G.items) {
    if (it.dead) continue;
    it.t++;
    if (it.kind === 'key') {
      it.x = it.hx; it.y = it.hy + Math.sin(it.t * 0.09) * 5;
      if (rectHit(it, p)) {
        it.dead = true; G.keys++; G.score += 400;
        Snd.sfx('power'); burst(it.x + 11, it.y + 11, '#f2c14e', 14);
        toast('カギを みつけた！（' + G.keys + '／' + G.needKeys + '）', 2000);
      }
      continue;
    }
    if (it.kind === 'star' || it.kind === 'life') {
      it.vy = Math.min(it.vy + (it.kind === 'life' ? 0.3 : 0.4), 9);
      it.hitWall = 0; const o = { x: it.x, y: it.y, w: it.w, h: it.h, vx: it.vx, vy: it.vy };
      moveBody(o, null);
      it.x = o.x; it.y = o.y; it.vy = o.vy;
      if (o.hitWall) it.vx *= -1;
      if (o.ground) it.vy = it.kind === 'life' ? -5.2 : -6.5;
      if (rectHit(it, p)) {
        it.dead = true;
        if (it.kind === 'life') { gainLife(''); burst(it.x + 11, it.y + 11, '#f5629b', 10); }
        else {
          p.star = 480; p.big = 1; p.growT = 26; Snd.sfx('power'); G.score += 500;
          popText(p.x + 10, p.y, 'でっかい むてきモード！', '#f2c14e');
          burst(p.x + p.w / 2, p.y + p.h / 2, '#f2c14e', 14);
        }
      }
    } else if (it.kind === 'ball') {
      it.vy = Math.min(it.vy + 0.34, 9);
      const o = { x: it.x, y: it.y, w: it.w, h: it.h, vx: it.vx, vy: it.vy };
      moveBody(o, null);
      it.x = o.x; it.y = o.y;
      if (o.ground) { it.vy = -5.2; } else it.vy = o.vy;
      if (o.hitWall) it.dead = true;
      if (it.t > 300) it.dead = true;
      if (rectHit(it, p) && p.inv <= 0) { it.dead = true; if (p.star > 0) { } else hurt(); }
    }
  }
  G.items = G.items.filter(i => !i.dead && i.y < (G.H + 3) * T);
}

/* ---------------- 敵とプレイヤーの接触 ---------------- */
function collideEnemies() {
  const p = G.player;
  if (p.dead) return;
  for (const e of G.ents) {
    if (e.dead) continue;
    if (!rectHit(p, e)) continue;
    const stomp = p.vy > 0.8 && (p.y + p.h) - e.y < 22;
    if (p.star > 0) {
      if (e.type === 'K') { bossHit(e); } else { killEnemy(e); G.score += 200; popText(e.x + e.w / 2, e.y, '+200', '#f2c14e'); Snd.sfx('stomp'); }
      continue;
    }
    if (e.type === 'K') {
      if (stomp) { bossHit(e); p.vy = -11; }
      else if (p.inv <= 0) hurt();
      continue;
    }
    if (e.state === 'shell' && Math.abs(e.vx) < 0.3 && !stomp) {
      e.vx = (p.x + p.w / 2 < e.x + e.w / 2 ? 1 : -1) * 7.2; e.shellTimer = 0;
      Snd.sfx('stomp'); G.score += 50; continue;
    }
    if (stomp) {
      p.vy = Key.jump ? -13.0 : -9.4; p.jumping = true;
      Snd.sfx('stomp'); G.shake = 3;
      if (e.type === 't' && e.state !== 'shell') {
        e.state = 'shell'; e.vx = 0; e.shellTimer = 0; e.h = 20; e.y += 4;
        G.score += 100; popText(e.x + e.w / 2, e.y, '+100', '#fff');
      } else if (e.hp > 1) {
        e.hp--; e.flash = 30; e.sp *= 1.9; e.vx = e.dir * e.sp;
        G.score += 100; popText(e.x + e.w / 2, e.y, 'おこった！', '#e5484d');
      } else {
        killEnemy(e); G.score += 150; popText(e.x + e.w / 2, e.y, '+150', '#fff');
      }
    } else if (p.inv <= 0) hurt();
  }
}

function bossHit(b) {
  if (b.inv > 0) return;
  b.hp--; b.inv = 80; b.flash = 80; G.shake = 12; Snd.sfx('boss');
  burst(b.x + b.w / 2, b.y + b.h / 2, '#f2c14e', 16);
  G.score += 1000;
  if (b.hp <= 0) {
    b.dead = true; G.bossDead = true; Snd.sfx('clear');
    popText(b.x + b.w / 2, b.y, 'まいったにゃ〜！', '#f2c14e');
    toast('ボスを たおした！ チャッピーちゃんを たすけよう！', 2800);
  } else popText(b.x + b.w / 2, b.y, 'あと ' + b.hp + ' かい！', '#fff');
}

/* =======================================================================
   描画
   ======================================================================= */
const THEME = {
  jungle: { sky: ['#1d4a2c', '#3f7d3f'], top: '#5aa845', top2: '#3f7f33', dirt: '#6b4a2c', dirt2: '#4e351f',
            far: '#276137', near: '#17452a', leaf: '#3f8f45', vine: '#7ac24f', mote: '#d9f27a' },
  swamp:  { sky: ['#16303a', '#2c5a52'], top: '#4c8f6e', top2: '#356b52', dirt: '#4b4230', dirt2: '#332e22',
            far: '#20464a', near: '#153036', leaf: '#3a7a63', vine: '#6fae7a', mote: '#9be8c8' },
  ruins:  { sky: ['#2b2338', '#5c4a52'], top: '#9a8f7a', top2: '#776d5b', dirt: '#5a4f45', dirt2: '#3e372f',
            far: '#3d3448', near: '#271f30', leaf: '#4f7a4a', vine: '#87a95c', mote: '#e6c98a' },
  temple: { sky: ['#171129', '#3a2352'], top: '#8f7fb2', top2: '#6a5c8c', dirt: '#463a5e', dirt2: '#2f2740',
            far: '#241a3a', near: '#150f24', leaf: '#4a6f5e', vine: '#9d7ec4', mote: '#ffd27a' }
};

function drawBG() {
  const th = THEME[G.theme];
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  const cx = G.cam.x, cy = G.cam.y;

  /* 遠くの 木のみき */
  ctx.fillStyle = th.far;
  for (let i = 0; i < 9; i++) {
    const x = ((i * 190 - cx * 0.18) % (VW + 380)) - 190;
    const w = 26 + (i % 3) * 16;
    const off = (i % 4) * 40 - cy * 0.08;
    ctx.fillRect(x, -60 + off, w, VH + 200);
    ctx.beginPath();
    ctx.ellipse(x + w / 2, 40 + off, w * 2.1, 46, 0, 0, 6.3); ctx.fill();
  }
  /* 手前の みきと 葉 */
  ctx.fillStyle = th.near;
  for (let i = 0; i < 6; i++) {
    const x = ((i * 285 - cx * 0.34) % (VW + 570)) - 285;
    const w = 40 + (i % 2) * 22;
    const off = (i % 3) * 60 - cy * 0.14;
    ctx.fillRect(x, -80 + off, w, VH + 240);
  }
  ctx.fillStyle = th.leaf;
  ctx.globalAlpha = 0.4;
  for (let i = 0; i < 12; i++) {
    const x = ((i * 152 - cx * 0.28) % (VW + 300)) - 150;
    const y = ((i * 97 - cy * 0.2) % (VH + 260)) - 130;
    leafCluster(x, y, 30 + (i % 3) * 12);
  }
  ctx.globalAlpha = 1;
  /* ただよう ひかりの つぶ（ホタル） */
  ctx.fillStyle = th.mote;
  for (let i = 0; i < 18; i++) {
    const ph = G.frames * 0.012 + i;
    const x = ((i * 143 - cx * 0.5 + Math.sin(ph) * 22) % (VW + 160)) - 80;
    const y = ((i * 111 - cy * 0.5 + Math.cos(ph * 1.3) * 18) % (VH + 160)) - 80;
    ctx.globalAlpha = 0.25 + Math.abs(Math.sin(ph * 2)) * 0.55;
    ctx.beginPath(); ctx.arc(x, y, 1.6 + (i % 3) * 0.9, 0, 6.3); ctx.fill();
  }
  ctx.globalAlpha = 1;
  /* 上からの こもれび */
  const sun = ctx.createLinearGradient(0, 0, 0, VH * 0.7);
  sun.addColorStop(0, 'rgba(255,246,190,.16)');
  sun.addColorStop(1, 'rgba(255,246,190,0)');
  ctx.fillStyle = sun; ctx.fillRect(0, 0, VW, VH * 0.7);
}

function leafCluster(x, y, r) {
  for (let k = 0; k < 5; k++) {
    const a = k * 1.256;
    ctx.beginPath();
    ctx.ellipse(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.4, r * 0.5, r * 0.3, a, 0, 6.3);
    ctx.fill();
  }
}

/* 肉球（フテ猫のしるし） */
function pawMark(cx, cy, s, col) {
  ctx.fillStyle = col;
  ell(cx, cy + 3.2 * s, 5.4 * s, 4.4 * s); ctx.fill();
  const toes = [[-5.4, -3.0], [-2.0, -5.4], [2.0, -5.4], [5.4, -3.0]];
  for (const [tx, ty] of toes) { ell(cx + tx * s, cy + ty * s, 2.1 * s, 2.4 * s); ctx.fill(); }
}

/* 新聞紙でつつんだ はこ（中身入り＝? / からっぽ＝U） */
function newsBox(px, py, used, seed) {
  const paper = used ? '#c3b9a2' : '#efe7d4';
  const edge = used ? '#8d8471' : '#b79a63';
  ctx.fillStyle = paper; ctx.fillRect(px, py, T, T);
  /* 新聞の 文字っぽい すじ */
  ctx.fillStyle = used ? 'rgba(60,52,38,.12)' : 'rgba(60,52,38,.2)';
  const lineY = [4, 9, 22, 27];          /* まん中は 肉球のために あけておく */
  for (let i = 0; i < 4; i++) {
    const ry = py + lineY[i], w1 = 7 + ((seed + i * 3) % 5), w2 = 6 + ((seed + i * 7) % 6);
    ctx.fillRect(px + 4, ry, w1, 1.6);
    ctx.fillRect(px + 6 + w1, ry, w2, 1.6);
  }
  /* おりめ（左上と右下の 角） */
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 9, py); ctx.lineTo(px, py + 9); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.10)';
  ctx.beginPath(); ctx.moveTo(px + T, py + T); ctx.lineTo(px + T - 9, py + T); ctx.lineTo(px + T, py + T - 9); ctx.closePath(); ctx.fill();
  /* わく */
  ctx.strokeStyle = edge; ctx.lineWidth = 2.5;
  ctx.strokeRect(px + 1.25, py + 1.25, T - 2.5, T - 2.5);
  /* 肉球のしるし */
  if (used) {
    pawMark(px + T / 2, py + T / 2 + 1, 0.85, 'rgba(60,52,38,.22)');
  } else {
    const gl = 0.5 + Math.sin(G.frames * 0.11 + seed) * 0.5;
    ctx.save();
    ctx.shadowColor = 'rgba(232,132,43,' + (0.35 + gl * 0.45) + ')';
    ctx.shadowBlur = 5 + gl * 5;
    pawMark(px + T / 2, py + T / 2 + 1, 0.98, '#2a2118');
    pawMark(px + T / 2, py + T / 2 + 0.4, 0.85, '#e8842b');
    ctx.restore();
  }
}

function drawTiles() {
  const th = THEME[G.theme];
  const x0 = Math.max(0, Math.floor(G.cam.x / T) - 1), x1 = Math.min(G.W - 1, Math.ceil((G.cam.x + VW) / T));
  const y0 = Math.max(0, Math.floor(G.cam.y / T) - 1), y1 = Math.min(G.H - 1, Math.ceil((G.cam.y + VH) / T));
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const c = G.rows[y][x];
      if (c === ' ') continue;
      const px = x * T - G.cam.x, py = y * T - G.cam.y;
      switch (c) {
        case '#': {
          const open = !isSolid(tileAt(x, y - 1));
          ctx.fillStyle = open ? th.top : th.dirt;
          ctx.fillRect(px, py, T, T);
          if (open) {
            ctx.fillStyle = th.top2; ctx.fillRect(px, py + T - 9, T, 9);
            ctx.fillStyle = th.dirt; ctx.fillRect(px, py + T - 4, T, 4);
            ctx.fillStyle = 'rgba(255,255,255,.20)'; ctx.fillRect(px, py, T, 4);
          } else {
            ctx.fillStyle = th.dirt2;
            ctx.fillRect(px + 4, py + 6, 6, 5); ctx.fillRect(px + 19, py + 17, 7, 5);
            ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.fillRect(px, py + T - 3, T, 3);
          }
          ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 1;
          ctx.strokeRect(px + .5, py + .5, T - 1, T - 1);
          break;
        }
        case 'B':
          ctx.fillStyle = '#b5713f'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#8d5027';
          ctx.fillRect(px, py + 15, T, 3); ctx.fillRect(px + 15, py, 3, 15); ctx.fillRect(px + 6, py + 18, 3, 14);
          ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(px, py, T, 3);
          break;
        case '?': {
          const b = Math.sin(G.frames * 0.12 + x) * 0.4;
          newsBox(px, py + b, false, x);
          break;
        }
        case 'U':
          newsBox(px, py, true, x);
          break;
        case 'L': {                                   /* つる */
          const sw = Math.sin(G.frames * 0.05 + y * 0.6) * 1.6;
          ctx.strokeStyle = th.vine; ctx.lineWidth = 5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(px + T / 2 + sw, py);
          ctx.quadraticCurveTo(px + T / 2 - sw, py + T / 2, px + T / 2 + sw, py + T);
          ctx.stroke();
          ctx.fillStyle = th.leaf;
          for (let i = 0; i < 2; i++) {
            const ly = py + 8 + i * 15, side = (y + i) % 2 ? 1 : -1;
            ctx.beginPath();
            ctx.ellipse(px + T / 2 + side * 7, ly, 6.5, 3.4, side * 0.5, 0, 6.3);
            ctx.fill();
          }
          ctx.lineCap = 'butt';
          break;
        }
        case 'D': {                                   /* カギの とびら */
          ctx.fillStyle = '#6b4a2c'; ctx.fillRect(px, py, T, T);
          ctx.fillStyle = '#8a6238'; ctx.fillRect(px + 3, py, T - 6, T);
          ctx.strokeStyle = '#4a3320'; ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(px + 3, py + 10); ctx.lineTo(px + T - 3, py + 10);
          ctx.moveTo(px + 3, py + 22); ctx.lineTo(px + T - 3, py + 22);
          ctx.stroke();
          if (!isSolid(tileAt(x, y - 1))) {           /* いちばん上に カギあな */
            ctx.fillStyle = '#f2c14e';
            ctx.beginPath(); ctx.arc(px + T / 2, py + T - 8, 5, 0, 6.3); ctx.fill();
            ctx.fillRect(px + T / 2 - 2, py + T - 8, 4, 7);
          }
          break;
        }
        case '=':
          ctx.fillStyle = th.dirt; ctx.fillRect(px, py, T, 11);
          ctx.fillStyle = th.top; ctx.fillRect(px, py, T, 5);
          ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(px, py + 9, T, 2);
          break;
        case '^': {
          const dn = isSolid(tileAt(x, y - 1)) && !isSolid(tileAt(x, y + 1));
          ctx.fillStyle = G.theme === 'cave' ? '#c8d4e8' : '#d8dee8';
          for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            if (dn) { ctx.moveTo(px + i * 8, py); ctx.lineTo(px + i * 8 + 8, py); ctx.lineTo(px + i * 8 + 4, py + T - 4); }
            else { ctx.moveTo(px + i * 8, py + T); ctx.lineTo(px + i * 8 + 8, py + T); ctx.lineTo(px + i * 8 + 4, py + 5); }
            ctx.closePath(); ctx.fill();
          }
          break;
        }
        case 'W': {
          const w = Math.sin(G.frames * 0.08 + x * .6) * 3;
          ctx.fillStyle = G.theme === 'cave' ? '#e8602e' : '#3f8fd6';
          ctx.fillRect(px, py - 4 + w, T, T + 8);
          ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(px, py - 4 + w, T, 4);
          break;
        }
        case 'S': {
          const sp = (G.springAnim && G.springAnim.x === x && G.springAnim.y === y) ? G.springAnim.t : 0;
          const hh = 16 - sp;
          ctx.fillStyle = '#4a4a52'; ctx.fillRect(px + 4, py + T - hh, T - 8, hh);
          ctx.fillStyle = '#c9ccd6';
          for (let i = 0; i < 3; i++) ctx.fillRect(px + 4, py + T - hh + i * (hh / 3), T - 8, 3);
          ctx.fillStyle = '#e5484d'; ctx.fillRect(px + 1, py + T - hh - 6, T - 2, 7);
          ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(px + 1, py + T - hh - 6, T - 2, 2);
          break;
        }
        case 'o': {
          const b = Math.sin(G.frames * 0.14 + x * 0.7) * 2.5;
          drawCoin(px + T / 2, py + T / 2 + b, 10);
          break;
        }
      }
    }
  }
  if (G.springAnim) { G.springAnim.t--; if (G.springAnim.t <= 0) G.springAnim = null; }
}

function drawCoin(x, y, r) {
  const sq = Math.abs(Math.cos(G.frames * 0.07));
  ctx.save(); ctx.translate(x, y); ctx.scale(0.35 + sq * 0.65, 1);
  ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#d79c25'; ctx.beginPath(); ctx.arc(0, 0, r * 0.66, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#fff2c8';
  ctx.beginPath(); ctx.arc(0, -r * 0.15, r * 0.3, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(-r * 0.34, -r * 0.42, r * 0.15, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.34, -r * 0.42, r * 0.15, 0, 6.3); ctx.fill();
  ctx.restore();
}

/* --- 敵の絵（手描き） --- */
function outline(fn, lw) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = '#2f2318'; ctx.lineWidth = lw || 3.4;
  fn(); ctx.stroke(); ctx.fill();
}
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.3); }
function eyes(x, y, r, dir, angry) {
  ctx.fillStyle = '#fff';
  ell(x - r * 1.5, y, r, r * 1.15); ctx.fill();
  ell(x + r * 1.5, y, r, r * 1.15); ctx.fill();
  ctx.fillStyle = '#20180f';
  ell(x - r * 1.5 + dir * r * .35, y + r * .12, r * .55, r * .62); ctx.fill();
  ell(x + r * 1.5 + dir * r * .35, y + r * .12, r * .55, r * .62); ctx.fill();
  if (angry) {
    ctx.strokeStyle = '#20180f'; ctx.lineWidth = 2.4; ctx.beginPath();
    ctx.moveTo(x - r * 2.5, y - r * 1.5); ctx.lineTo(x - r * .6, y - r * .7);
    ctx.moveTo(x + r * 2.5, y - r * 1.5); ctx.lineTo(x + r * .6, y - r * .7);
    ctx.stroke();
  }
}

function drawEnemy(e) {
  const x = e.x - G.cam.x, y = e.y - G.cam.y, w = e.w, h = e.h;
  if (x < -120 || x > VW + 120 || y < -140 || y > VH + 140) return;
  ctx.save();
  if (e.flash > 0 && (e.flash >> 2) % 2 === 0) ctx.globalAlpha = 0.55;
  const walk = Math.sin(e.t * 0.16) * 2;
  const dir = e.dir;

  if (e.type === 't') {
    if (e.state === 'shell') {
      ctx.fillStyle = '#4f9e4a';
      outline(() => { ell(x + w / 2, y + h / 2 + 2, w * 0.5, h * 0.55); });
      ctx.fillStyle = '#3b7a38';
      for (let i = -1; i <= 1; i++) { ell(x + w / 2 + i * 8, y + h / 2, 5, 5.5); ctx.fill(); }
    } else {
      ctx.fillStyle = '#f2d08a';                       /* 足 */
      outline(() => { ell(x + w * 0.28, y + h - 3 + walk * .3, 6, 5); });
      outline(() => { ell(x + w * 0.72, y + h - 3 - walk * .3, 6, 5); });
      ctx.fillStyle = '#57ab4f';                       /* こうら */
      outline(() => { ell(x + w / 2, y + h * 0.52, w * 0.47, h * 0.44); });
      ctx.fillStyle = '#3d8339';
      for (let i = -1; i <= 1; i++) { ell(x + w / 2 + i * 8, y + h * 0.5, 4.4, 5); ctx.fill(); }
      ctx.fillStyle = '#f2d08a';                       /* 頭 */
      outline(() => { ell(x + w / 2 + dir * w * 0.42, y + h * 0.3, 8.5, 7.5); });
      eyes(x + w / 2 + dir * w * 0.44, y + h * 0.27, 2.6, dir);
    }
  } else if (e.type === 'd') {
    ctx.fillStyle = '#b98147';
    outline(() => { ell(x + w * .3, y + h - 4 + walk * .4, 5.5, 5); });
    outline(() => { ell(x + w * .7, y + h - 4 - walk * .4, 5.5, 5); });
    outline(() => {                                    /* しっぽ */
      ctx.beginPath(); ctx.moveTo(x + w / 2 - dir * w * .42, y + h * .45);
      ctx.quadraticCurveTo(x + w / 2 - dir * w * .7, y + h * .18 + walk, x + w / 2 - dir * w * .5, y + h * .1);
      ctx.lineTo(x + w / 2 - dir * w * .36, y + h * .38); ctx.closePath();
    });
    outline(() => { ell(x + w / 2, y + h * .58, w * .42, h * .34); });
    ctx.fillStyle = '#c9915a';
    outline(() => { ell(x + w / 2 + dir * w * .22, y + h * .27, w * .34, h * .3); });
    ctx.fillStyle = '#8c5c31';                          /* 耳 */
    outline(() => { ell(x + w / 2 + dir * w * .06, y + h * .16, 5, 8.5); }, 2.6);
    ctx.fillStyle = '#f6e4cd';
    outline(() => { ell(x + w / 2 + dir * w * .38, y + h * .36, 7, 5.5); }, 2.6);
    ctx.fillStyle = '#2f2318';
    ell(x + w / 2 + dir * w * .48, y + h * .33, 2.6, 2.2); ctx.fill();
    eyes(x + w / 2 + dir * w * .2, y + h * .24, 2.6, dir);
  } else if (e.type === 'b') {
    const angry = e.hp <= 1;
    ctx.fillStyle = angry ? '#7d4a3a' : '#8b6247';
    outline(() => { ell(x + w * .28, y + h - 5 + walk * .5, 8, 6.5); });
    outline(() => { ell(x + w * .72, y + h - 5 - walk * .5, 8, 6.5); });
    outline(() => { ell(x + w / 2 - dir * w * .34, y + h * .55, 7, 9); });
    outline(() => { ell(x + w / 2, y + h * .6, w * .44, h * .38); });
    outline(() => { ell(x + w / 2 - dir * w * .2, y + h * .17, 6.5, 6.5); }, 2.8);
    outline(() => { ell(x + w / 2 + dir * w * .22, y + h * .17, 6.5, 6.5); }, 2.8);
    outline(() => { ell(x + w / 2, y + h * .3, w * .38, h * .3); });
    ctx.fillStyle = '#f0dcc0';
    outline(() => { ell(x + w / 2 + dir * w * .1, y + h * .38, 10, 7.5); }, 2.6);
    ctx.fillStyle = '#2f2318';
    ell(x + w / 2 + dir * w * .12, y + h * .335, 3.2, 2.6); ctx.fill();
    eyes(x + w / 2 + dir * w * .04, y + h * .24, 3, dir, angry);
    if (angry) {
      ctx.strokeStyle = '#e5484d'; ctx.lineWidth = 2.6;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(x + w * .1 + i * 5, y - 4 - (i % 2) * 3);
        ctx.lineTo(x + w * .16 + i * 5, y - 12 - (i % 2) * 3); ctx.stroke();
      }
    }
  } else if (e.type === 'r') {
    const flap = Math.sin(e.t * 0.24) * 9;
    ctx.fillStyle = '#5aa9e6';
    outline(() => {                                    /* つばさ */
      ctx.beginPath(); ctx.moveTo(x + w / 2, y + h * .5);
      ctx.quadraticCurveTo(x + w / 2 - dir * 22, y + h * .5 - flap, x + w / 2 - dir * 6, y + h * .72);
      ctx.closePath();
    });
    outline(() => {
      ctx.beginPath(); ctx.moveTo(x + w / 2, y + h * .5);
      ctx.quadraticCurveTo(x + w / 2 + dir * 22, y + h * .5 + flap, x + w / 2 + dir * 6, y + h * .72);
      ctx.closePath();
    });
    ctx.fillStyle = '#7cc0f2';
    outline(() => { ell(x + w / 2, y + h * .55, w * .34, h * .42); });
    ctx.fillStyle = '#a8d8f7';
    outline(() => { ell(x + w / 2 + dir * w * .18, y + h * .3, w * .27, h * .34); });
    ctx.fillStyle = '#f2a03c';
    outline(() => {
      ctx.beginPath(); ctx.moveTo(x + w / 2 + dir * w * .34, y + h * .3);
      ctx.lineTo(x + w / 2 + dir * w * .58, y + h * .38);
      ctx.lineTo(x + w / 2 + dir * w * .34, y + h * .44); ctx.closePath();
    }, 2.4);
    eyes(x + w / 2 + dir * w * .18, y + h * .26, 2.4, dir);
  } else if (e.type === 'k' || e.type === 'K') {
    const img = e.type === 'K' ? IMG.kuro_boss
      : animFrame('kuro', 'kuro', e, e.vx, e.ground, e.vy);
    const boss = e.type === 'K';
    if (boss) {                                   /* 足もとの 赤いオーラ */
      const pulse = 1 + Math.sin(G.frames * 0.09) * 0.12;
      const gr = ctx.createRadialGradient(x + w / 2, y + h - 4, 4, x + w / 2, y + h - 4, w * 0.85 * pulse);
      gr.addColorStop(0, 'rgba(229,72,77,.55)');
      gr.addColorStop(1, 'rgba(229,72,77,0)');
      ctx.fillStyle = gr;
      ell(x + w / 2, y + h - 4, w * 0.85 * pulse, h * 0.3 * pulse); ctx.fill();
    }
    if (img) {
      const bob = e.ground ? Math.sin(e.t * 0.14) * 1.6 : 0;
      let hh, ww;
      if (boss) { hh = h * 1.2; ww = hh * img.width / img.height; }
      else { const sc = h * 1.16 / SPR_REF; hh = img.height * sc; ww = img.width * sc; }
      ctx.save();
      ctx.translate(x + w / 2, y + h + bob);
      if (boss) { ctx.shadowColor = 'rgba(229,72,77,.85)'; ctx.shadowBlur = 18; }
      ctx.scale(dir >= 0 ? 1 : -1, 1);
      ctx.drawImage(img, -ww / 2, -hh, ww, hh);
      ctx.restore();
    }
    if (boss) {                                   /* 頭の上に「ボス」の ふきだし */
      const ly = y - 24 + Math.sin(G.frames * 0.1) * 3;
      const lx = x + w / 2;
      ctx.fillStyle = '#e5484d'; ctx.strokeStyle = '#2a2118'; ctx.lineWidth = 3;
      rrect(lx - 30, ly - 15, 60, 22, 8); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(lx - 7, ly + 6); ctx.lineTo(lx, ly + 15); ctx.lineTo(lx + 7, ly + 6);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fdf6e6';
      ctx.font = '900 15px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('ボス', lx, ly - 3);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }
  }
  ctx.restore();
}

/* --- プレイヤー --- */
function drawPlayer() {
  const p = G.player;
  const x = p.x - G.cam.x, y = p.y - G.cam.y;
  if (p.inv > 0 && !p.dead && (p.inv >> 2) % 2 === 0) return;
  let img = (p.climb && IMG.fute_climb) ? IMG.fute_climb
    : animFrame('fute', 'fute_stand', p, p.vx, p.ground, p.vy);
  if (!img) return;
  const grow = p.growT > 0 ? 1 + Math.sin((1 - p.growT / 26) * Math.PI) * 0.22 : 1;
  const bigS = (p.big ? 1.52 : 1) * grow;
  const sc = p.h * 1.72 * bigS / SPR_REF;
  const H2 = img.height * sc, W2 = img.width * sc;
  const bob = p.ground ? Math.sin(p.anim) * 1.8 : 0;
  const tilt = p.ground ? 0 : clamp(p.vy * 0.012, -0.14, 0.16);
  ctx.save();
  ctx.translate(x + p.w / 2, y + p.h + bob);
  if (p.star > 0) {
    ctx.shadowColor = 'hsl(' + ((G.frames * 9) % 360) + ',95%,62%)';
    ctx.shadowBlur = 22;
  }
  ctx.rotate(p.dir * tilt);
  ctx.scale(p.dir >= 0 ? 1 : -1, 1);
  const sq = p.ground && p.landT > 0 ? 1 + p.landT * 0.02 : 1;
  ctx.drawImage(img, -W2 / 2 * sq, -H2 / sq, W2 * sq, H2 / sq);
  ctx.restore();
}

/* --- ゴール／中間 --- */
function drawGoal() {
  if (!G.goal) return;
  const locked = G.boss && !G.bossDead;
  const x = G.goal.x - G.cam.x, y = G.goal.y - G.cam.y;
  if (x < -80 || x > VW + 80) return;
  const bob = Math.sin(G.frames * 0.06) * 4;
  ctx.save(); ctx.globalAlpha = locked ? 0.32 : 1;
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.ellipse(x, y - 2, 22, 6, 0, 0, 6.3); ctx.fill();
  const im = IMG.chappy;
  if (im) {
    const h = 62, w = h * im.width / im.height;
    ctx.drawImage(im, x - w / 2, y - h + bob, w, h);
  }
  if (!locked) {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    for (let i = 0; i < 6; i++) {
      const a = G.frames * 0.04 + i * 1.05;
      ctx.globalAlpha = 0.35 + 0.3 * Math.sin(a * 2);
      ctx.fillText('✦', x + Math.cos(a) * 38, y - 34 + Math.sin(a) * 30);
    }
  }
  ctx.restore();
}
function drawCheck() {
  if (!G.check) return;
  const x = G.check.x - G.cam.x, y = G.check.y - G.cam.y;
  if (x < -60 || x > VW + 60) return;
  ctx.strokeStyle = '#6b5a44'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 56); ctx.stroke();
  const w = G.check.got ? 26 + Math.sin(G.frames * 0.12) * 3 : 22;
  ctx.fillStyle = G.check.got ? '#5aa845' : '#c8bda8';
  ctx.beginPath(); ctx.moveTo(x, y - 56); ctx.lineTo(x + w, y - 48); ctx.lineTo(x, y - 40); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('🐾', x + w * 0.5, y - 45);
}

/* --- 移動床 --- */
function drawMovers() {
  for (const m of G.movers) {
    const x = m.x - G.cam.x, y = m.y - G.cam.y;
    if (x < -100 || x > VW + 100) continue;
    ctx.fillStyle = '#6b5a44'; ctx.fillRect(x, y, m.w, m.h);
    ctx.fillStyle = '#8d7a5e'; ctx.fillRect(x, y, m.w, 5);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x, y + m.h - 3, m.w, 3);
    ctx.fillStyle = '#c8bda8';
    for (let i = 0; i < 3; i++) ctx.fillRect(x + 8 + i * (m.w - 20) / 2, y + 4, 5, 4);
  }
}

/* --- アイテム --- */
function drawItems() {
  for (const it of G.items) {
    const x = it.x - G.cam.x, y = it.y - G.cam.y;
    if (it.kind === 'star') {
      ctx.save(); ctx.translate(x + 12, y + 12); ctx.rotate(it.t * 0.08);
      ctx.fillStyle = 'hsl(' + ((it.t * 7) % 360) + ',95%,62%)';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 ? 5 : 13, a = i * Math.PI / 5 - Math.PI / 2;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath(); ctx.strokeStyle = '#2f2318'; ctx.lineWidth = 2.6; ctx.stroke(); ctx.fill();
      ctx.restore();
    } else if (it.kind === 'key') {
      ctx.save(); ctx.translate(x + 11, y + 11);
      ctx.rotate(Math.sin(it.t * 0.06) * 0.25);
      ctx.strokeStyle = '#2f2318'; ctx.lineWidth = 2.4;
      ctx.fillStyle = '#f2c14e';
      ctx.beginPath(); ctx.arc(0, -5, 6, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#1b2440';
      ctx.beginPath(); ctx.arc(0, -5, 2.2, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#f2c14e';
      ctx.beginPath(); ctx.rect(-2, 0, 4, 12); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.rect(2, 6, 5, 3); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.rect(2, 11, 4, 3); ctx.fill(); ctx.stroke();
      ctx.restore();
    } else if (it.kind === 'life') {
      const pu = 1 + Math.sin(it.t * 0.18) * 0.08;
      ctx.save(); ctx.translate(x + 11, y + 11); ctx.scale(pu, pu);
      ctx.fillStyle = '#f5629b'; ctx.strokeStyle = '#2f2318'; ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(0, 9);
      ctx.bezierCurveTo(-13, -1, -8, -11, 0, -5);
      ctx.bezierCurveTo(8, -11, 13, -1, 0, 9);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath(); ctx.ellipse(-4, -3, 2.4, 1.6, -0.5, 0, 6.3); ctx.fill();
      ctx.restore();
    } else {
      ctx.save(); ctx.translate(x + 8, y + 8); ctx.rotate(it.t * 0.2);
      ctx.fillStyle = '#fdf6e6'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 6.3); ctx.fill();
      ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(-6, 0, 8, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(6, 0, 8, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
      ctx.strokeStyle = '#2f2318'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, 6.3); ctx.stroke();
      ctx.restore();
    }
  }
}

/* --- パーティクル --- */
function drawParts() {
  for (const q of G.parts) {
    const a = q.life / q.max;
    ctx.globalAlpha = clamp(a, 0, 1);
    if (q.txt) {
      ctx.fillStyle = q.col; ctx.font = 'bold 15px ' + FONT;
      ctx.textAlign = 'center'; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 3.5;
      ctx.strokeText(q.txt, q.x - G.cam.x, q.y - G.cam.y);
      ctx.fillText(q.txt, q.x - G.cam.x, q.y - G.cam.y);
    } else {
      ctx.fillStyle = q.col;
      ctx.fillRect(q.x - G.cam.x - q.size / 2, q.y - G.cam.y - q.size / 2, q.size, q.size);
    }
  }
  ctx.globalAlpha = 1;
}

/* =======================================================================
   ループ
   ======================================================================= */
function update() {
  G.frames++;
  if (G.state === 'play') {
    const p = G.player;
    if (!p.dead) {
      const wasGround = p.ground;
      updatePlayer();
      if (!wasGround && p.ground) { p.landT = 8; part(p.x + p.w / 2, p.y + p.h, rnd(-1.5, 1.5), -0.4, '#fff', 16, 4, .08); }
      if (p.landT > 0) p.landT--;
      G.time++;
    } else {
      p.vy = Math.min(p.vy + GRAV, MAXFALL); p.y += p.vy;
      if (--G.deadTimer <= 0) {
        if (G.lives <= 0) gameOver(); else { respawn(); Snd.playMusic(G.theme); }
      }
    }
    /* 移動床 */
    for (const m of G.movers) {
      m.t += 0.016;
      const nx = m.vert ? m.ox : m.ox + Math.sin(m.t) * m.range;
      const ny = m.vert ? m.oy + Math.sin(m.t) * m.range : m.oy;
      m.px = nx - m.x; m.py = ny - m.y; m.x = nx; m.y = ny;
    }
    G.ents.forEach(updateEnemy);
    updateItems();
    if (!p.dead) collideEnemies();
    G.ents = G.ents.filter(e => !e.dead || (e.deadT = (e.deadT || 0) + 1) < 2);
  }
  markSeen();

  /* パーティクル */
  for (const q of G.parts) { q.x += q.vx; q.y += q.vy; q.vy += q.g; q.life--; }
  G.parts = G.parts.filter(q => q.life > 0);

  /* カメラ */
  if (G.player) {
    const p = G.player;
    const look = clamp(p.vx * 16, -70, 70);
    const tx = clamp(p.x + p.w / 2 - VW / 2 + look, 0, Math.max(0, G.W * T - VW));
    const ty = clamp(p.y + p.h / 2 - VH / 2 + 30, 0, Math.max(0, G.H * T - VH));
    G.cam.x = lerp(G.cam.x, tx, 0.12);
    G.cam.y = lerp(G.cam.y, ty, G.H * T > VH ? 0.16 : 0.12);
  }
  if (G.shake > 0) G.shake *= 0.85;
  if (G.clearTimer > 0 && --G.clearTimer === 0) showClear();
}

/* 角丸の四角（roundRect 未対応ブラウザでも動くように） */
function rrect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

/* --- ミニマップ（歩いたところが 見えるようになる） --- */
function markSeen() {
  const p = G.player;
  if (!p || !G.seen) return;
  const cx = Math.floor((p.x + p.w / 2) / T), cy = Math.floor((p.y + p.h / 2) / T);
  const R = 8, RY = 6;
  for (let y = cy - RY; y <= cy + RY; y++) {
    if (y < 0 || y >= G.H) continue;
    for (let x = cx - R; x <= cx + R; x++) {
      if (x < 0 || x >= G.W) continue;
      G.seen[y * G.W + x] = 1;
    }
  }
}

function drawMap() {
  if (!G.seen || !G.rows.length) return;
  const cell = Math.max(1.6, Math.min(3, 168 / G.W));
  const mw = G.W * cell, mh = G.H * cell;
  const ox = 12, oy = 52;
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = 'rgba(12,20,16,.62)';
  ctx.strokeStyle = 'rgba(253,246,230,.55)'; ctx.lineWidth = 2;
  rrect(ox - 5, oy - 5, mw + 10, mh + 10, 7); ctx.fill(); ctx.stroke();
  for (let y = 0; y < G.H; y++) {
    for (let x = 0; x < G.W; x++) {
      if (!G.seen[y * G.W + x]) continue;
      const c = G.rows[y][x];
      let col = null;
      if (c === 'D') col = '#e8a33d';
      else if (c === 'L') col = '#7ac24f';
      else if (isSolid(c)) col = 'rgba(228,238,225,.42)';
      else if (isHazard(c)) col = '#e5484d';
      if (col) { ctx.fillStyle = col; ctx.fillRect(ox + x * cell, oy + y * cell, cell, cell); }
    }
  }
  const dot = (wx, wy, col, r) => {
    const mx = ox + (wx / T) * cell, my = oy + (wy / T) * cell;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(mx, my, r, 0, 6.3); ctx.fill();
  };
  for (const it of G.items)
    if (it.kind === 'key' && !it.dead && G.seen[Math.floor(it.y / T) * G.W + Math.floor(it.x / T)])
      dot(it.x, it.y, '#f2c14e', 2.6);
  if (G.goal && G.seen[Math.floor(G.goal.y / T - 1) * G.W + Math.floor(G.goal.x / T)])
    dot(G.goal.x, G.goal.y - T / 2, '#f5629b', 2.6);
  if (G.boss && !G.bossDead && G.seen[Math.floor((G.boss.y + G.boss.h / 2) / T) * G.W + Math.floor((G.boss.x + G.boss.w / 2) / T)])
    dot(G.boss.x + G.boss.w / 2, G.boss.y + G.boss.h / 2, '#e5484d', 3);
  if (G.player && (G.frames >> 3) % 2 === 0)
    dot(G.player.x + G.player.w / 2, G.player.y + G.player.h / 2, '#fff', 3);
  ctx.restore();
}

/* --- ボスの たいりょくバー --- */
function drawBossBar() {
  const b = G.boss;
  if (!b || G.bossDead || b.dead || !G.bossMet) return;
  const w = 250, h = 15, x = (VW - w) / 2, y = 44;
  ctx.save();
  ctx.fillStyle = 'rgba(20,28,51,.72)';
  ctx.strokeStyle = '#2a2118'; ctx.lineWidth = 3;
  rrect(x - 5, y - 5, w + 10, h + 10, 9); ctx.fill(); ctx.stroke();
  for (let i = 0; i < b.maxHp; i++) {
    const cw = (w - (b.maxHp - 1) * 4) / b.maxHp;
    ctx.fillStyle = i < b.hp ? (b.inv > 0 && (G.frames >> 2) % 2 ? '#fff' : '#e5484d') : 'rgba(253,246,230,.2)';
    rrect(x + i * (cw + 4), y, cw, h, 4); ctx.fill();
  }
  ctx.fillStyle = '#fdf6e6';
  ctx.font = '900 13px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.strokeStyle = '#2a2118'; ctx.lineWidth = 4;
  ctx.strokeText('ボス クロネコさん', VW / 2, y - 8);
  ctx.fillText('ボス クロネコさん', VW / 2, y - 8);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0d1220'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.save();
  ctx.translate(offX, offY); ctx.scale(scale, scale);
  ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
  const sh = G.shake > 0.4 ? G.shake : 0;
  ctx.translate(rnd(-sh, sh), rnd(-sh, sh));
  if (G.rows.length) {
    drawBG();
    drawTiles();
    drawMovers();
    drawCheck();
    drawGoal();
    drawItems();
    G.ents.forEach(drawEnemy);
    if (G.player) drawPlayer();
    drawParts();
    drawMap();
    drawBossBar();
    if (G.player && G.player.star > 0) {
      ctx.fillStyle = 'hsla(' + ((G.frames * 9) % 360) + ',95%,60%,.10)';
      ctx.fillRect(0, 0, VW, VH);
    }
  }
  ctx.restore();
}

let last = 0, acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!last) last = ts;
  let dt = ts - last; last = ts;
  if (dt > 200) dt = 200;
  acc += dt;
  let n = 0;
  while (acc >= 16.667 && n < 5) { update(); acc -= 16.667; n++; }
  render();
  if (G.state === 'play') updHUD();
}

/* =======================================================================
   UI
   ======================================================================= */
const screens = document.getElementById('screens');
const card = document.getElementById('card');
const hud = document.getElementById('hud');
const toastEl = document.getElementById('toast');
let toastT = null;
function toast(msg, ms) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), ms || 1800);
}
const soundBtn = document.getElementById('sound');
const pausebtn = document.getElementById('pausebtn');
function updSoundBtn() {
  soundBtn.textContent = Snd.muted ? '🔇' : '🔊';
  /* ポーズボタンが 出ていないときは 音ボタンを 上に詰める */
  if (pausebtn.classList.contains('on')) soundBtn.classList.remove('nopause');
  else soundBtn.classList.add('nopause');
}
soundBtn.addEventListener('click', () => { Snd.init(); Snd.setMuted(!Snd.muted); updSoundBtn(); });
pausebtn.addEventListener('click', () => { Snd.init(); pauseToggle(); });

function heartSVG(on) {
  return '<svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.1-8-10.4A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.6C20 15.9 12 21 12 21z" fill="' +
    (on ? '#f5629b' : 'rgba(253,246,230,.22)') + '" stroke="#2a2118" stroke-width="1.6"/></svg>';
}
let hudCache = '';
function updHUD() {
  const sig = G.lives + '/' + G.coins + '/' + G.score + '/' + G.lv + '/' + G.keys + '/' + G.needKeys;
  if (sig === hudCache) return;
  hudCache = sig;
  let h = '';
  if (G.lives <= START_LIVES) { for (let i = 0; i < START_LIVES; i++) h += heartSVG(i < G.lives); }
  else h = heartSVG(true) + '<b style="font-size:15px;margin-left:2px">×' + G.lives + '</b>';
  document.getElementById('lives').innerHTML = h;
  document.getElementById('coins').textContent = G.coins;
  document.getElementById('score').textContent = G.score;
  const kc = document.getElementById('keychip');
  kc.style.display = G.needKeys ? 'flex' : 'none';
  kc.style.color = G.keys >= G.needKeys ? '#f2c14e' : '';
  document.getElementById('keycnt').textContent = G.keys + ' / ' + G.needKeys;
  document.getElementById('stagename').textContent = (G.lv + 1) + '. ' + LEVELS[G.lv].name;
}

function showScreen(html) {
  card.innerHTML = html; screens.classList.remove('hide');
  if (typeof releaseAllTouch === 'function') releaseAllTouch();
  hud.hidden = true; dragzone.classList.remove('on');
  if (typeof releaseAllTouch === 'function') releaseAllTouch();
  document.getElementById('pausebtn').classList.remove('on');
  updSoundBtn();
  applyCompact();
  const f = card.querySelector('.btn,.sitem');
  if (f) { try { f.focus({ preventScroll: true }); } catch (err) { /* 未対応でも つづける */ } }
  const toTop = () => { card.scrollTop = 0; screens.scrollTop = 0; };
  toTop();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(toTop);
  setTimeout(toTop, 0); setTimeout(toTop, 70);
}
function hideScreen() {
  screens.classList.add('hide'); hud.hidden = false;
  document.getElementById('pausebtn').classList.add('on');
  if (isTouch) {
    dragzone.classList.add('on');
    if (guideLeft > 0) {
      guideLeft--;
      try { store.setItem(GUIDEKEY, String(guideLeft)); } catch (err) {}
      const g = document.getElementById('guide');
      g.classList.remove('on'); void g.offsetWidth; g.classList.add('on');
    }
  }
  updSoundBtn();
}

function titleScreen() {
  G.state = 'title'; Snd.playMusic('title');
  showScreen(
    '<div class="cols">' +
      '<div class="colA">' +
        '<img class="heroimg" src="' + SPRITE_SRC.fute_front + '" alt="フテ猫">' +
        '<h1>フテ猫の大冒険</h1>' +
        '<div class="episode">ジャングル編</div>' +
        '<p>クロネコさんが チャッピーちゃんを ジャングルの おくへ つれさった！' +
        'つるを のぼり、カギを あつめて めいろを ぬけよう。</p>' +
      '</div>' +
      '<div class="colB">' +
        (isTouch
          ? '<p class="sub touchhelp">👆 左がわを <b>なぞって うごく</b>／右がわを <b>タップで ジャンプ</b></p>'
          : '<div class="keys"><span class="key">← → 　うごく</span><span class="key">スペース　ジャンプ</span>' +
            '<span class="key">↑↓　つる</span><span class="key">Shift　ダッシュ</span><span class="key">M　音</span></div>') +
        '<p class="rules">🌿 <b>つる</b>に つかまって ↑↓ で のぼりおり<br>'+
        '🔑 <b>カギ</b>を ぜんぶ あつめると <b>とびら</b>が ひらく<br>'+
        '🗺️ 左上の <b>ミニマップ</b>に 歩いたところが うつる<br>'+
        '🐾 <b>肉球ブロック</b>を 下から たたくと アイテム<br>'+
        '⭐ <b>スター</b>で むてき　💗 <b>ハート</b>で ライフ+1</p>' +
      '</div>' +
    '</div>' +
    '<div class="acts">' +
      '<button class="btn" id="btnStart" type="button">はじめる</button>' +
      '<button class="btn ghost" id="btnSelect" type="button">ステージをえらぶ</button>' +
      (progress.best ? '<p class="sub">ハイスコア ' + progress.best + '</p>' : '') +
    '</div>'
  );
  document.getElementById('btnStart').addEventListener('click', () => { Snd.init(); goLandscape(); startGame(0); });
  document.getElementById('btnSelect').addEventListener('click', () => { Snd.init(); goLandscape(); selectScreen(); });
}

function selectScreen() {
  G.state = 'select';
  let list = '';
  LEVELS.forEach((L, i) => {
    const unlocked = i === 0 || progress.cleared.indexOf(i - 1) >= 0;
    const done = progress.cleared.indexOf(i) >= 0;
    list += '<div class="sitem' + (done ? ' clear' : '') + '" data-i="' + i + '" tabindex="0"' +
      (unlocked ? '' : ' aria-disabled="true"') + '>' +
      '<span class="sno">' + (i + 1) + '</span><span>' + L.name + '</span>' +
      '<span class="stag">' + (unlocked ? (done ? 'クリア済み' : 'あそべる') : 'まだ ロック') + '</span></div>';
  });
  showScreen('<h2>ステージをえらぶ</h2><div class="slist">' + list + '</div>' +
    '<button class="btn ghost" id="btnBack" type="button">もどる</button>');
  card.querySelectorAll('.sitem').forEach(el => {
    const go = () => {
      if (el.getAttribute('aria-disabled') === 'true') { toast('まえの ステージを クリアしてね'); return; }
      Snd.init(); startGame(parseInt(el.dataset.i, 10));
    };
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => { if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); go(); } });
  });
  document.getElementById('btnBack').addEventListener('click', titleScreen);
}

function startGame(i) {
  G.lives = START_LIVES; G.coins = 0; G.score = 0;
  G.state = 'play'; loadLevel(i); hideScreen(); updHUD();
}

function stageClear() {
  G.state = 'clear'; Snd.stopMusic(); Snd.sfx('clear');
  G.score += 1000 + G.lives * 300 + Math.max(0, 4000 - G.time * 2);
  if (progress.cleared.indexOf(G.lv) < 0) progress.cleared.push(G.lv);
  progress.coins = (progress.coins || 0) + G.coins;
  if (G.score > (progress.best || 0)) progress.best = G.score;
  save(SAVEKEY, progress);
  G.clearTimer = 70;
  for (let i = 0; i < 34; i++)
    part(G.goal.x + rnd(-40, 40), G.goal.y - 40, rnd(-3, 3), rnd(-7, -2),
      ['#f2c14e', '#f5629b', '#7cc0f2', '#5aa845'][i % 4], rnd(50, 90), 6, .18);
}

function showClear() {
  const isLast = G.lv >= LEVELS.length - 1;
  showScreen(
    '<img class="heroimg" src="' + SPRITE_SRC.chappy_yay + '" alt="チャッピーちゃん">' +
    '<h2>' + (isLast ? 'ぜんステージ クリア！' : 'ステージ ' + (G.lv + 1) + ' クリア！') + '</h2>' +
    '<p>' + (isLast
      ? 'クロネコさんを たおして チャッピーちゃんを たすけだした！<br>「フテ猫、やるじゃん。つぎは まけないからな」'
      : 'チャッピーちゃん「つぎの ステージも いっしょに いこう！」') + '</p>' +
    '<div class="scoreline"><span>コイン <b>' + G.coins + '</b></span>' +
    '<span>スコア <b>' + G.score + '</b></span>' +
    '<span>ライフ <b>' + G.lives + '</b></span></div>' +
    (isLast ? '' : '<button class="btn" id="btnNext" type="button">つぎの ステージへ</button>') +
    '<button class="btn ghost" id="btnTitle" type="button">タイトルへ</button>'
  );
  const n = document.getElementById('btnNext');
  if (n) n.addEventListener('click', () => { G.state = 'play'; loadLevel(G.lv + 1); hideScreen(); });
  document.getElementById('btnTitle').addEventListener('click', titleScreen);
}

function gameOver() {
  G.state = 'over'; Snd.stopMusic(); Snd.sfx('over');
  setTimeout(() => { if (G.state === 'over') Snd.playMusic('title'); }, 1500);
  showScreen(
    '<h2>ゲームオーバー</h2>' +
    '<p>クロネコさん「フン、まだまだだにゃ」<br>もういちど ちょうせん してみよう！</p>' +
    '<div class="scoreline"><span>コイン <b>' + G.coins + '</b></span><span>スコア <b>' + G.score + '</b></span></div>' +
    '<button class="btn" id="btnRetry" type="button">このステージを やりなおす</button>' +
    '<button class="btn ghost" id="btnTitle2" type="button">タイトルへ</button>'
  );
  document.getElementById('btnRetry').addEventListener('click', () => startGame(G.lv));
  document.getElementById('btnTitle2').addEventListener('click', titleScreen);
}

function pauseToggle() {
  if (G.state === 'play') {
    G.state = 'pause'; Snd.stopMusic();
    showScreen('<h2>ちょっと きゅうけい</h2>' +
      '<p class="sub">' + LEVELS[G.lv].name + '</p>' +
      '<div class="scoreline"><span>コイン <b>' + G.coins + '</b></span><span>スコア <b>' + G.score + '</b></span></div>' +
      '<button class="btn" id="btnResume" type="button">つづける</button>' +
      '<button class="btn ghost" id="btnRestart" type="button">さいしょから</button>' +
      '<button class="btn ghost" id="btnTitle3" type="button">タイトルへ</button>');
    document.getElementById('btnResume').addEventListener('click', () => { G.state = 'play'; hideScreen(); Snd.playMusic(G.theme); });
    document.getElementById('btnRestart').addEventListener('click', () => startGame(G.lv));
    document.getElementById('btnTitle3').addEventListener('click', titleScreen);
  } else if (G.state === 'pause') {
    G.state = 'play'; hideScreen(); Snd.playMusic(G.theme);
  }
}
function handleEnter(code) {
  if (code === 'Escape') { pauseToggle(); return; }
  if (G.state === 'title') { const b = document.getElementById('btnStart'); if (b) b.click(); }
}

/* ---------------- 起動 ---------------- */
loadImages().then(() => {
  applyOrient(); resize(); updSoundBtn(); titleScreen();
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
