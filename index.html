<style>
:root{
  --night:#141c33; --night2:#1b2440; --ink:#2a2118;
  --paper:#fdf6e6; --paper2:#f2e6cd;
  --orange:#e8842b; --orange2:#c96718;
  --blue:#3e6fa8; --sky:#79c7f2;
  --pink:#f5629b; --gold:#f2c14e; --green:#5aa845;
  --danger:#e5484d;
  --ui: -apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);
  font-family:var(--ui);color:var(--paper);overscroll-behavior:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100%;height:100%;max-width:100vw;max-height:100vh}
canvas{display:block;width:100%;height:100%;image-rendering:auto;background:#0d1220}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;padding:8px 10px;display:flex;
  gap:10px;align-items:center;pointer-events:none;font-weight:800;
  text-shadow:0 2px 0 rgba(0,0,0,.45);font-size:15px;letter-spacing:.02em}
.hchip{background:rgba(20,28,51,.62);border:2px solid rgba(253,246,230,.28);
  border-radius:999px;padding:3px 11px;display:flex;align-items:center;gap:6px;
  backdrop-filter:blur(3px)}
#lives{gap:3px}
.heart{width:17px;height:17px;flex:none}
#stagename{margin-left:auto;font-size:13px;opacity:.92;max-width:44%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 横向き回転（スマホが縦のとき） ---------- */
#stage.rot{position:absolute;left:50%;top:50%;max-width:none;max-height:none;
  transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}

/* ---------- 指なぞり操作 ---------- */
#dragzone{position:absolute;inset:0;display:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#dragzone.on{display:block}
/* さいしょだけ 操作エリアの めやすを 出す */
#guide{position:absolute;inset:0;pointer-events:none;display:none;
  font-weight:900;font-size:15px;color:rgba(253,246,230,.9);
  text-shadow:0 2px 6px rgba(0,0,0,.7)}
#guide.on{display:block;animation:guidefade 5.5s ease-out forwards}
#guide .half{position:absolute;top:0;bottom:0;width:50%;display:grid;place-items:center;gap:6px}
#guide .half.l{left:0;border-right:2px dashed rgba(253,246,230,.28)}
#guide .half.r{right:0}
#guide .bub{background:rgba(20,28,51,.72);border:2px solid rgba(253,246,230,.5);
  border-radius:14px;padding:8px 14px;text-align:center;line-height:1.6}
@keyframes guidefade{0%,62%{opacity:1}100%{opacity:0}}
#stick{position:absolute;width:108px;height:108px;margin:-54px 0 0 -54px;border-radius:50%;
  border:3px solid rgba(253,246,230,.45);background:rgba(27,36,64,.3);
  display:none;pointer-events:none;backdrop-filter:blur(2px)}
#stick.on{display:block}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;
  border-radius:50%;background:rgba(232,132,43,.85);border:3px solid rgba(253,246,230,.75);
  transition:background .1s}
#stick.dash #knob{background:rgba(245,98,155,.9)}
#tapfx{position:absolute;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;
  border:4px solid rgba(253,246,230,.75);display:none;pointer-events:none;opacity:0}
#tapfx.go{display:block;animation:tapring .42s ease-out}
@keyframes tapring{from{opacity:.95;transform:scale(.45)}to{opacity:0;transform:scale(1.25)}}
#orienthint{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:6;
  background:rgba(20,28,51,.92);border:3px solid var(--paper);border-radius:16px;
  padding:10px 18px;font-weight:900;font-size:16px;white-space:nowrap;display:none}
#orienthint.on{display:block}
#stage.rot #orienthint{left:auto;right:12px;top:50%;bottom:auto;transform:translateY(-50%) rotate(-90deg)}

/* ---------- overlay screens ---------- */
#screens{position:absolute;inset:0;display:grid;place-items:center;padding:18px;
  background:radial-gradient(120% 90% at 50% 15%,rgba(27,36,64,.72),rgba(10,14,26,.94))}
#screens.hide{display:none}
.card{width:min(560px,100%);max-height:100%;overflow:auto;text-align:center;
  background:linear-gradient(180deg,rgba(253,246,230,.97),rgba(242,230,205,.97));
  color:var(--ink);border:4px solid var(--ink);border-radius:22px;
  box-shadow:0 14px 0 rgba(0,0,0,.35),0 26px 60px rgba(0,0,0,.5);padding:16px 20px}
.card h1{margin:.1em 0 .12em;font-size:clamp(26px,7vw,40px);line-height:1.14;
  color:var(--orange2);text-shadow:2px 2px 0 var(--gold),4px 4px 0 rgba(42,33,24,.18)}
.card h2{margin:.1em 0 .4em;font-size:clamp(20px,5.4vw,28px);color:var(--orange2)}
.card p{margin:.45em 0;font-size:15px;line-height:1.7}
.card .rules{font-size:14px;line-height:1.85;text-align:left;
  max-width:390px;margin:.5em auto;opacity:.92}
.episode{display:inline-block;margin:.1em 0 .5em;padding:5px 20px;border-radius:999px;
  background:var(--ink);color:var(--paper);border:3px solid var(--gold);
  font-size:clamp(15px,4.2vw,20px);font-weight:900;letter-spacing:.08em;
  box-shadow:0 4px 0 rgba(0,0,0,.3)}
.sub{font-size:13px;opacity:.78}
.btn{appearance:none;border:3px solid var(--ink);border-radius:14px;
  background:var(--orange);color:#fff;font-family:inherit;font-weight:900;
  font-size:18px;padding:12px 26px;margin:7px 5px;cursor:pointer;
  box-shadow:0 5px 0 var(--orange2);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--orange2)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 #b8a888}
.btn.ghost:active{box-shadow:0 1px 0 #b8a888}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.heroimg{height:min(88px,14vh);margin:0 auto 2px;display:block}
.keys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 4px}
.key{background:var(--paper);border:2px solid var(--ink);border-radius:9px;
  padding:5px 10px;font-size:13px;font-weight:800;box-shadow:0 3px 0 #cbb99a}
.slist{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0 4px;text-align:left}
.sitem{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);
  border-radius:13px;background:var(--paper);padding:9px 12px;font-weight:800;
  font-size:15px;cursor:pointer;box-shadow:0 4px 0 #cbb99a}
.sitem:active{transform:translateY(3px);box-shadow:0 1px 0 #cbb99a}
.sitem[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.sno{width:29px;height:29px;flex:none;border-radius:50%;background:var(--blue);
  color:#fff;display:grid;place-items:center;font-size:14px}
.sitem.clear .sno{background:var(--green)}
.stag{margin-left:auto;font-size:12px;opacity:.7;font-weight:700}
.scoreline{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;
  font-weight:900;font-size:17px;margin:10px 0 2px}
.scoreline b{color:var(--orange2)}
/* タイトルの 2だん組み（ひろくて ひくい画面のとき だけ） */
.cols{display:block}
.acts{margin-top:2px}
#screens.compact .card{padding:10px 14px;border-radius:16px}
#screens.compact .heroimg{display:none}
#screens.compact .card h1{font-size:clamp(20px,5vw,28px);margin:0 0 .1em}
#screens.compact .episode{margin:0 0 .3em;padding:2px 14px;font-size:14px;border-width:2px}
#screens.compact .card p{margin:.25em 0;font-size:13px;line-height:1.5}
#screens.compact .card .rules{font-size:12.5px;line-height:1.6;margin:.2em 0}
#screens.compact .btn{font-size:16px;padding:8px 18px;margin:4px 4px 0}
#screens.compact .key{font-size:11.5px;padding:3px 7px}
#screens.compact .keys{margin:4px 0 2px;gap:5px}
#screens.compact .slist{gap:5px;margin:6px 0 2px}
#screens.compact .sitem{padding:6px 9px;font-size:13.5px}
#screens.compact .scoreline{font-size:15px;gap:12px;margin:4px 0 2px}
#screens.wide .card{width:min(720px,100%)}
#screens.wide .cols{display:grid;grid-template-columns:1.02fr .98fr;
  gap:4px 18px;align-items:center;text-align:left}
#screens.wide .cols .colA{text-align:center}
#screens.wide .cols .colB{border-left:2px dashed rgba(42,33,24,.22);padding-left:16px}
#screens.wide .card .rules{text-align:left;max-width:none}
#screens.wide .touchhelp{margin:0 0 .3em}
#screens.wide .acts{margin-top:6px;border-top:2px dashed rgba(42,33,24,.18);padding-top:6px}

/* 画面が ひくい とき（スマホの よこ画面）は カードを コンパクトに */
@media (max-height:540px){
  .heroimg{display:none}
  .card{padding:12px 16px;border-radius:18px}
  .card h1{font-size:clamp(22px,5.6vw,30px);margin:.05em 0 .1em}
  .episode{margin:.05em 0 .35em;padding:3px 16px;font-size:15px;border-width:2px}
  .card p{margin:.3em 0;font-size:13.5px;line-height:1.55}
  .card .rules{font-size:12.5px;line-height:1.62;margin:.35em auto}
  .btn{font-size:16px;padding:9px 20px;margin:5px 4px}
  .keys{margin:8px 0 2px;gap:6px}
  .key{font-size:12px;padding:4px 8px}
  .slist{gap:6px;margin:8px 0 2px}
  .sitem{padding:7px 10px;font-size:14px}
  .scoreline{font-size:15px;gap:12px;margin:6px 0 2px}
}

#toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);
  background:rgba(20,28,51,.9);border:3px solid var(--paper);border-radius:14px;
  padding:9px 18px;font-weight:900;font-size:17px;opacity:0;transition:opacity .3s;
  pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#pausebtn{position:absolute;right:10px;top:52px;z-index:5;width:40px;height:40px;
  border-radius:50%;border:3px solid rgba(253,246,230,.5);background:rgba(27,36,64,.55);
  color:var(--paper);font-size:15px;display:none;place-items:center;cursor:pointer}
#pausebtn.on{display:grid}
/* 音ボタンは 画面右上。ジャンプボタン（右下）と ぜったいに 重ならない位置に置く */
#sound{position:absolute;right:10px;top:100px;z-index:5;width:40px;height:40px;
  border-radius:50%;border:3px solid rgba(253,246,230,.5);background:rgba(27,36,64,.55);
  color:var(--paper);font-size:17px;display:grid;place-items:center;cursor:pointer}
#sound.nopause{top:52px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div class="hchip" id="lives"></div>
    <div class="hchip"><span id="coinicon">🐾</span><span id="coins">0</span></div>
    <div class="hchip" id="keychip" style="display:none">🔑 <span id="keycnt">0 / 0</span></div>
    <div class="hchip">SCORE <span id="score">0</span></div>
    <div class="hchip" id="stagename">ステージ1</div>
  </div>

  <div id="dragzone">
    <div id="stick"><div id="knob"></div></div>
    <div id="tapfx"></div>
    <div id="guide">
      <div class="half l"><div class="bub">👆 ここを なぞる<br>うごく・つるを のぼる</div></div>
      <div class="half r"><div class="bub">👆 ここを タップ<br>ジャンプ</div></div>
    </div>
  </div>

  <button id="sound" type="button" aria-label="音のオン・オフ">🔊</button>
  <button id="pausebtn" type="button" aria-label="一時停止">⏸</button>
  <div id="orienthint">📱 スマホを よこむきに してね</div>
  <div id="toast"></div>
  <div id="screens"><div class="card" id="card"></div></div>
</div></div>

const IMG = {};

/* ---------------- キャラクターの アニメ ----------------
   歩行4コマ・走行4コマ・ジャンプ4コマを、うごきの はやさと
   空中かどうかで えらぶ。コマおくりは「すすんだ きょり」で
   かぞえるので、ゆっくり 歩けば ゆっくり、はしれば はやく なる。  */
function animFrame(pre, idle, o, vx, ground, vy) {
  const sp = Math.abs(vx || 0);
  if (!ground) {
    if ((vy || 0) < -4.5) return IMG[pre + '_j2'] || IMG[idle];
    if ((vy || 0) < 3.5) return IMG[pre + '_j3'] || IMG[idle];
    return IMG[pre + '_j4'] || IMG[idle];
  }
  if ((o.landT || 0) > 7) return IMG[pre + '_j1'] || IMG[idle];
  if (sp < 0.35) { o.animD = 0; return IMG[idle]; }
  o.animD = (o.animD || 0) + sp;
  const run = sp > 3.0;
  const k = 1 + (Math.floor(o.animD / (run ? 7.5 : 6.5)) % 4);
  return IMG[pre + (run ? '_r' : '_w') + k] || IMG[idle];
}

function loadImages() {
  const keys = Object.keys(SPRITE_SRC);
  return Promise.all(keys.map(k => new Promise(res => {
    const im = new Image();
    im.onload = () => { IMG[k] = im; res(); };
    im.onerror = () => { IMG[k] = null; res(); };
    im.src = SPRITE_SRC[k];
  })));
}

const Snd = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  muted: progress.muted === true, timer: null, next: 0, step: 0, song: null,
  pending: null, silent: null,

  /* iOS のマナーモードでも鳴らすための下ごしらえ（ユーザー操作中に呼ぶこと） */
  unlockMedia() {
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
    } catch (err) { /* 未対応ブラウザ */ }
    try {
      if (!this.silent && typeof document.createElement === 'function') {
        const a = document.createElement('audio');
        a.src = SILENT_WAV; a.loop = true; a.volume = 0.001;
        a.setAttribute('playsinline', ''); a.preload = 'auto';
        this.silent = a;
      }
      if (this.silent && this.silent.play) {
        const pr = this.silent.play();
        if (pr && pr.catch) pr.catch(() => {});
      }
    } catch (err) { /* 無音要素が使えなくても致命的ではない */ }
  },

  init() {
    this.unlockMedia();
    if (this.ctx) { this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC({ latencyHint: 'interactive' }); }
    catch (err) { try { this.ctx = new AC(); } catch (e2) { return; } }
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.85;
    this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.30;
    this.musicGain.connect(this.master);
    this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.55;
    this.sfxGain.connect(this.master);
    if (this.ctx.addEventListener) this.ctx.addEventListener('statechange', () => this.resume());
    this.resume();
  },

  /* 中断された AudioContext を起こし直し、止まっていた BGM を鳴らし直す */
  resume() {
    if (!this.ctx) return;
    if (this.ctx.state === 'suspended' && this.ctx.resume) {
      const pr = this.ctx.resume();
      if (pr && pr.then) pr.then(() => this.restart()).catch(() => {});
    }
    this.restart();
  },
  restart() {
    if (!this.ctx || this.ctx.state === 'suspended') return;
    if (this.pending && !this.timer) this.playMusic(this.pending);
  },
  setMuted(m) {
    this.muted = m; progress.muted = m; save(SAVEKEY, progress);
    if (this.master) this.master.gain.value = m ? 0 : 0.85;
  },
  blip(freq, dur, type, gain, when, slideTo) {
    if (!this.ctx || this.muted) return;
    const t0 = when || this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.3, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t0); o.stop(t0 + dur + 0.03);
  },
  noise(dur, gain, when) {
    if (!this.ctx || this.muted) return;
    const t0 = when || this.ctx.currentTime;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = gain || 0.25;
    s.connect(g); g.connect(this.sfxGain); s.start(t0);
  },
  sfx(name) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    switch (name) {
      case 'jump': this.blip(430, 0.14, 'square', 0.24, t, 780); break;
      case 'stomp': this.blip(220, 0.10, 'square', 0.3, t, 90); this.noise(0.08, 0.16, t); break;
      case 'coin': this.blip(988, 0.07, 'square', 0.22, t); this.blip(1319, 0.13, 'square', 0.22, t + 0.06); break;
      case 'block': this.noise(0.11, 0.3, t); this.blip(160, 0.09, 'square', 0.2, t, 70); break;
      case 'bump': this.blip(150, 0.07, 'square', 0.18, t, 110); break;
      case 'spring': this.blip(300, 0.18, 'triangle', 0.3, t, 1100); break;
      case 'hurt': this.blip(400, 0.35, 'sawtooth', 0.3, t, 70); break;
      case 'power': [523, 659, 784, 1047].forEach((f, i) => this.blip(f, 0.13, 'square', 0.25, t + i * 0.07)); break;
      case 'check': [659, 880].forEach((f, i) => this.blip(f, 0.16, 'triangle', 0.28, t + i * 0.1)); break;
      case 'boss': this.blip(120, 0.25, 'sawtooth', 0.32, t, 60); this.noise(0.2, 0.3, t); break;
      case 'clear': [523, 659, 784, 1047, 1319].forEach((f, i) => this.blip(f, 0.22, 'square', 0.28, t + i * 0.11)); break;
      case 'over': [392, 330, 262, 196].forEach((f, i) => this.blip(f, 0.3, 'triangle', 0.3, t + i * 0.19)); break;
    }
  },
  /* --- BGM --- */
  songs: {
    /* -99 は 休符。bass は16ステップ、mel は32ステップ（8分音符きざみ） */
    title: { bpm: 128,
      bass: [0, 0, 7, 7, 5, 5, 7, 7, 0, 0, 7, 7, 9, 9, 7, 7],
      mel: [12, -99, 14, 16, 19, -99, 16, 14, 12, -99, 16, 19, 21, -99, 19, 16,
            17, -99, 16, 14, 12, -99, 14, 16, 19, 21, 19, 16, 12, -99, -99, -99] },
    jungle: { bpm: 144,
      bass: [0, 0, 7, 7, 5, 5, 3, 3, 0, 0, 7, 7, 5, 7, 9, 7],
      mel: [12, 14, 16, 19, 16, 14, 12, 9, 12, 16, 19, 21, 19, 16, 12, 14,
            17, 19, 21, 24, 21, 19, 17, 14, 12, 16, 19, 16, 14, 12, -99, -99] },
    ruins: { bpm: 128,
      bass: [0, 3, 5, 7, 5, 3, 0, -2, 0, 3, 5, 7, 8, 7, 5, 3],
      mel: [12, 15, 19, 15, 17, 14, 12, 10, 12, 15, 19, 22, 19, 15, 12, 7,
            14, 17, 20, 17, 15, 12, 10, 12, 15, 19, 22, 24, 22, 19, 15, -99] },
    swamp: { bpm: 108,
      bass: [0, 0, -2, -2, 3, 3, -4, -4, 0, 0, -2, -2, -5, -5, -4, -4],
      mel: [12, -99, 10, -99, 7, -99, 10, 12, 15, -99, 14, -99, 12, -99, 10, -99,
            7, -99, 5, 7, 10, -99, 12, -99, 10, -99, 7, -99, 5, -99, -99, -99] },
    temple: { bpm: 166,
      bass: [0, 0, 5, 5, 3, 3, 7, 7, 0, 0, 5, 5, 8, 8, 7, 7],
      mel: [19, 22, 24, 26, 24, 22, 19, 17, 19, 24, 26, 29, 26, 24, 22, 19,
            20, 23, 26, 28, 26, 23, 20, 19, 17, 19, 22, 26, 24, 22, 19, -99] }
  },
  playMusic(theme) {
    this.pending = theme;
    this.song = this.songs[theme] || this.songs.jungle;
    this.step = 0;
    if (!this.ctx || this.ctx.state === 'suspended') return;   /* 鳴らせる状態になったら resume() が鳴らし直す */
    this.next = this.ctx.currentTime + 0.08;
    if (this.timer) clearInterval(this.timer);
    this.timer = setInterval(() => this.sched(), 25);
  },
  stopMusic() {
    this.pending = null;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  },
  sched() {
    if (!this.ctx || !this.song || this.muted) return;
    if (this.ctx.state === 'suspended') return;
    const so = this.song, sp = 60 / so.bpm / 2;
    while (this.next < this.ctx.currentTime + 0.18) {
      const st = this.step, t0 = this.next;
      const root = 55 * Math.pow(2, 1 / 12);
      const bn = so.bass[st % so.bass.length];
      const mn = so.mel[st % so.mel.length];
      if (bn > -50) this.tone(root * Math.pow(2, bn / 12) * 2, sp * 0.86, 'triangle', 0.46, t0);
      if (mn > -50) this.tone(root * Math.pow(2, mn / 12) * 2, sp * 0.72, 'square', 0.17, t0, true);
      const k = st % 8;
      if (k === 0 || k === 6) this.kick(t0);
      if (k === 4) this.snare(t0);
      if (st % 2 === 0) this.hat(t0, sp * 0.24);
      this.next += sp; this.step++;
    }
  },
  tone(f, d, type, g, t0, duo) {
    const o = this.ctx.createOscillator(), gg = this.ctx.createGain();
    o.type = type; o.frequency.value = f;
    gg.gain.setValueAtTime(0.0001, t0);
    gg.gain.exponentialRampToValueAtTime(g, t0 + 0.015);
    gg.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(gg); gg.connect(this.musicGain); o.start(t0); o.stop(t0 + d + 0.02);
    if (duo) {   /* すこしズラした音を重ねて厚みを出す */
      const o2 = this.ctx.createOscillator();
      o2.type = type; o2.frequency.value = f; o2.detune.value = 9;
      o2.connect(gg); o2.start(t0); o2.stop(t0 + d + 0.02);
    }
  },
  kick(t0) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t0);
    o.frequency.exponentialRampToValueAtTime(44, t0 + 0.11);
    g.gain.setValueAtTime(0.5, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
    o.connect(g); g.connect(this.musicGain); o.start(t0); o.stop(t0 + 0.17);
  },
  snare(t0) {
    const n = Math.floor(this.ctx.sampleRate * 0.13);
    const b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
    const src = this.ctx.createBufferSource(); src.buffer = b;
    const hp = this.ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1300;
    const g = this.ctx.createGain(); g.gain.value = 0.22;
    src.connect(hp); hp.connect(g); g.connect(this.musicGain); src.start(t0);
  },
  hat(t0, d) {
    const n = Math.max(1, Math.floor(this.ctx.sampleRate * d));
    const b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), dd = b.getChannelData(0);
    for (let i = 0; i < n; i++) dd[i] = (Math.random() * 2 - 1) * (1 - i / n) * 0.5;
    const src = this.ctx.createBufferSource(); src.buffer = b;
    const hp = this.ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5200;
    const g = this.ctx.createGain(); g.gain.value = 0.075;
    src.connect(hp); hp.connect(g); g.connect(this.musicGain); src.start(t0);
  }
};
